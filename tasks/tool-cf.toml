# tasks/cf.toml — cf:* (Cloudflare) namespace: PURE cloudflare PRIMITIVES.
# role: Cloudflare CLI — `wrangler` + `curl` (HTTP)
#
# Each task drives ONLY wrangler (+ curl as HTTP plumbing). Tokens come from
# $env — the orchestration layer (cfapp:*) sets CLOUDFLARE_API_TOKEN from
# fnox; wrangler reads it automatically. NO fnox/gh here. The cross-tool CF
# Access flows moved to provision.toml (orchestration).
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/cf.toml?ref=<tag>",
#   ]

# ── cf:token-check ───────────────────────────────────────────────────────────
# Verify CLOUDFLARE_API_TOKEN is valid via /user/tokens/verify. Used as a
# precondition gate by deploy/prove tasks.
["cf:token-check"]
description = "verify CLOUDFLARE_API_TOKEN (from env) is valid via the CF API"
run = '''
#!/usr/bin/env nu

def main [] {
  # token comes from env (orchestration/dev provides it from fnox). curl is plumbing.
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "✗ CLOUDFLARE_API_TOKEN not set in env"
    exit 1
  }

  let result = (
    try {
      ^curl -sS -H $"Authorization: Bearer ($token)" "https://api.cloudflare.com/client/v4/user/tokens/verify" | from json
    } catch {
      {success: false}
    }
  )

  if ($result.success? | default false) {
    let status = ($result.result.status? | default "?")
    let id = ($result.result.id? | default "?")
    print $"✓ token valid \(id=($id) status=($status)\)"
  } else {
    print "✗ token invalid or expired"
    print ($result | to json)
    exit 1
  }
}
'''

# ── cf:profile ───────────────────────────────────────────────────────────────
# PRIMITIVE: capture a CPU or heap profile of a deployed Worker (or one Durable
# Object instance) via the profiling API — curl only, no wrangler/node. Writes
# the gzipped pprof and prints its path to stdout. The API attaches to an
# already-running isolate and never invokes the Worker, so send traffic during
# the capture. Token needs Workers Scripts Read.
["cf:profile"]
description = "PRIMITIVE: capture a production CPU/heap pprof of Worker <name> (or one Durable Object) via the CF API; curl only."
run = '''
#!/usr/bin/env nu

def main [
  worker: string                  # Worker name or ID (for a DO: the Worker that owns the namespace)
  --profile-type: string = "cpu"  # cpu | heap
  --duration-ms: int = 10000      # capture window, 1000–50000
  --version-id: string = "latest" # "latest" = newest UPLOADED version, not necessarily the deployed one
  --namespace-id: string = ""     # Durable Object namespace ID (with --actor-id)
  --actor-id: string = ""         # Durable Object instance ID (64 hex chars)
  --out: string = ""              # default: <worker>-<type>-<timestamp>.pb.gz
] {
  # token + account come from env (orchestration/dev provides them from fnox).
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "" | str trim)
  let account = ($env.CLOUDFLARE_ACCOUNT_ID? | default "" | str trim)
  if ($token | is-empty) or ($account | is-empty) {
    print --stderr "✗ CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in env"
    exit 1
  }
  if $profile_type not-in ["cpu" "heap"] {
    print --stderr $"✗ --profile-type must be cpu or heap, got ($profile_type)"
    exit 1
  }
  if $duration_ms < 1000 or $duration_ms > 50000 {
    print --stderr $"✗ --duration-ms must be 1000–50000, got ($duration_ms)"
    exit 1
  }
  if ($namespace_id | is-empty) != ($actor_id | is-empty) {
    print --stderr "✗ a Durable Object capture needs both --namespace-id and --actor-id"
    exit 1
  }

  let is_do = not ($actor_id | is-empty)
  let body = (
    {duration_ms: $duration_ms, profile_type: $profile_type}
    | merge (if $is_do { {namespace_id: $namespace_id, actor_id: $actor_id} } else { {} })
  )
  let stamp = (date now | format date "%Y%m%dT%H%M%S")
  let out = (if ($out | is-empty) { $"($worker)-($profile_type)-($stamp).pb.gz" } else { $out })
  let url = $"https://api.cloudflare.com/client/v4/accounts/($account)/workers/workers/($worker)/versions/($version_id)/profile"
  let target = (if $is_do { $"($worker) DO ($actor_id | str substring 0..7)…" } else { $worker })

  print --stderr $"→ capturing ($duration_ms) ms ($profile_type) profile of ($target) — send traffic now"
  # The auth header goes in on stdin (-H @-) so the token never shows in the process table.
  let code = (
    $"Authorization: Bearer ($token)"
    | ^curl -sS -X POST -H @- -H "Content-Type: application/json"
        --data ($body | to json --raw) --max-time ($duration_ms // 1000 + 60)
        -o $out -w "%{http_code}" $url
    | str trim
  )
  if $code != "200" {
    print --stderr $"✗ HTTP ($code)"
    if ($out | path exists) {
      let err = (open --raw $out | decode utf-8)
      print --stderr $err
      rm $out
      # 10393 / "no loaded isolate": the API only finds an isolate after sustained
      # traffic — a few seconds of warm-up was not enough in testing, ~20 s was.
      if ($err | str contains "10393") or ($err | str contains "no loaded isolate") {
        print --stderr "hint: keep traffic flowing for ~20 s BEFORE starting the capture (and during it), then retry"
      }
    }
    exit 1
  }
  print --stderr $"✓ ($out) — view with: go tool pprof -http=: ($out)"
  print $out
}
'''

# ── cf:d1-migrate ────────────────────────────────────────────────────────────
# Apply D1 migrations via wrangler. Pass-through wrapper.
["cf:d1-migrate"]
tools = { wrangler = "latest" }
description = "run D1 migrations"
run = '''
#!/usr/bin/env nu

def main [...args] {
  ^wrangler d1 migrations apply ...$args
}
'''

# ── cf:d1-create ─────────────────────────────────────────────────────────────
# PRIMITIVE: create a D1 database by name; print ONLY its id to stdout (status
# to stderr) so an orchestrator can capture it. NOT idempotent on its own —
# callers gate on existence (see cfapp:provision-d1-r2).
["cf:d1-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create D1 database <name>; prints the new database_id to stdout."
run = '''
#!/usr/bin/env nu

def main [name: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  print --stderr $"Creating D1 database '($name)' ..."
  let out = (^wrangler d1 create $name | complete | get stdout)
  let parsed = ($out | parse --regex '"database_id"\s*:\s*"([0-9a-f-]{36})"|database_id\s*=\s*"([0-9a-f-]{36})"')
  if ($parsed | length) == 0 {
    print --stderr "ERROR: could not parse database_id from output:"
    print --stderr $out
    exit 1
  }
  let id = ($parsed | first | get capture0? | default ($parsed | first | get capture1?))
  print $id
}
'''

# ── cf:d1-exec ───────────────────────────────────────────────────────────────
# PRIMITIVE: run a SQL file against a remote D1 database (by name).
["cf:d1-exec"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: execute a SQL file against remote D1 <name> (wrangler d1 execute --remote --file)."
run = '''
#!/usr/bin/env nu

def main [name: string, file: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  ^wrangler d1 execute $name --remote $"--file=($file)"
}
'''

# ── cf:r2-create ─────────────────────────────────────────────────────────────
# PRIMITIVE: idempotently create an R2 bucket by name.
["cf:r2-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create R2 bucket <name> if it doesn't already exist."
run = '''
#!/usr/bin/env nu

def main [bucket: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  let listing = (try { ^wrangler r2 bucket list | complete | get stdout } catch { "" })
  if ($listing | str contains $bucket) {
    print $"✓ R2 bucket '($bucket)' already exists"
  } else {
    print $"Creating R2 bucket '($bucket)' ..."
    ^wrangler r2 bucket create $bucket
  }
}
'''

# ── cf:queue-create ──────────────────────────────────────────────────────────
# PRIMITIVE: idempotently create a Cloudflare Queue by name.
["cf:queue-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create Cloudflare Queue <name> if it doesn't already exist."
run = '''
#!/usr/bin/env nu

def main [name: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  let existing = (try { ^wrangler queues list | complete | get stdout } catch { "" })
  if ($existing | str contains $name) {
    print $"✓ Queue '($name)' already exists"
  } else {
    print $"Creating queue '($name)' ..."
    ^wrangler queues create $name
  }
}
'''

# ── cf:secret-put ────────────────────────────────────────────────────────────
# PRIMITIVE: push a Worker secret. Value comes from $env.CF_SECRET_VALUE
# (orchestration sets it from fnox — kept out of the arg list, so it never shows
# in the process table). Drives ONLY wrangler.
["cf:secret-put"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: wrangler secret put <worker-var> from $env.CF_SECRET_VALUE."
run = '''
#!/usr/bin/env nu

def main [worker_var: string] {
  let val = ($env.CF_SECRET_VALUE? | default "" | str trim)
  if ($val | is-empty) {
    print --stderr $"✗ CF_SECRET_VALUE not set in env for ($worker_var)"
    exit 1
  }
  print $"→ wrangler secret put ($worker_var)"
  $val | ^wrangler secret put $worker_var
}
'''
