name: mise-tasks lint

on:
  push:
    branches: [main]
    paths: ["mise-tasks/**", "mise.toml", ".github/workflows/mise-tasks-lint.yml"]
  pull_request:
    paths: ["mise-tasks/**", "mise.toml", ".github/workflows/mise-tasks-lint.yml"]
  workflow_dispatch:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      # mise is the SSOT for all tool versions — reads mise.toml
      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Verify tasks load
        shell: bash
        run: mise tasks ls

      - name: Verify task scripts are executable and well-formed
        shell: 'mise exec -- nu --no-newline {0}'
        run: |
          # All mise-tasks files except *.md.
          let files = (
            ls **/*
            | where type == file
            | get name
            | where { |p| ($p | str starts-with "mise-tasks/") and (not ($p | str ends-with ".md")) }
          )

          mut fail = false
          for f in $files {
            let head = (open --raw $f | lines | first)
            let is_proof = ($f | str starts-with "mise-tasks/_proof/")

            # Shebang: bash OR nu only (port-on-touch migration in progress)
            if not (($head == "#!/usr/bin/env bash") or ($head == "#!/usr/bin/env nu")) {
              print $"✗ unsupported shebang \(($head)\): ($f)"
              $fail = true
            }
            # Tasks (not _proof smoke tests) require #MISE description= header
            if not $is_proof {
              let has_desc = (open --raw $f | lines | any { |l| $l | str starts-with "#MISE description=" })
              if not $has_desc {
                print $"✗ missing #MISE description= header: ($f)"
                $fail = true
              }
            }
            # Executable bit — nu's path/file metadata
            let is_exec = (try { ls -l $f | first | get mode | str contains "x" } catch { false })
            if not $is_exec {
              print $"✗ not executable: ($f)"
              $fail = true
            }
          }
          if $fail { exit 1 }
          print "✓ all task files are executable and well-formed"

      - name: Check for Tera-breaking syntax (bash files only)
        shell: 'mise exec -- nu --no-newline {0}'
        run: |
          # Tera treats {# as a comment opener. Only bash uses ${#VAR};
          # nu has its own length syntax (str length / length).
          let bad = (
            ls **/*
            | where type == file
            | get name
            | where { |p|
                ($p | str starts-with "mise-tasks/")
                and (not ($p | str ends-with ".md"))
                and (not ($p | str ends-with ".nu"))
                and (
                  let head = (open --raw $p | lines | first)
                  $head != "#!/usr/bin/env nu"
                )
              }
            | where { |p| open --raw $p | str contains '${#' }
          )
          if ($bad | length) > 0 {
            print "✗ found bash variable-length syntax in:"
            $bad | each { |f| print $"  ($f)" }
            print ""
            print "  Bash's curly-hash-VAR triggers Tera comment parsing — use wc -c / printf instead."
            exit 1
          }
          print "✓ no Tera-breaking syntax found"

      # Cross-platform proof: install nu via mise, run the proof script.
      # If this passes on all 3 OS legs, the nushell migration plan is
      # CI-validated for the joeblew999 org.
      # nushell + fnox are pinned in this repo's mise.toml [tools].
      # 'mise install' (run by mise-action above) installs them at those
      # pinned versions automatically — no need for ad-hoc 'mise use --global'.

      - name: Run nu cross-platform proof script
        shell: bash
        run: mise exec -- nu mise-tasks/_proof/nu-cross-platform.nu

      # fnox keychain provider proof — the question is whether GHA runners'
      # interactive logon sessions allow Credential Manager (Win) / Keychain
      # (mac) / secret-service (Linux) writes. fnox docs say "headless CI
      # not supported" — this step proves whether GHA's session-handling
      # qualifies as "interactive enough" for the real-world Windows desktop
      # user case we care about.
      #
      # Linux secret-service requires gnome-keyring + dbus, which Ubuntu
      # GHA runners don't have. The step is skipped there.
      - name: fnox keychain round-trip (macOS + Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          # Bootstrap empty fnox global config + keychain provider
          mise exec -- fnox init --global || true   # idempotent on already-init'd
          mise exec -- fnox provider add --global keychain keychain || true

          # Round-trip: set → get → assert match → remove
          EXPECTED='hello-from-${{ matrix.os }}-via-fnox-keychain'
          echo "→ writing TEST_FNOX_WIN_PROOF=$EXPECTED"
          printf '%s' "$EXPECTED" | mise exec -- fnox set --global -p keychain TEST_FNOX_WIN_PROOF

          echo "→ reading back via fnox get"
          ACTUAL=$(mise exec -- fnox get TEST_FNOX_WIN_PROOF)

          echo "→ asserting"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "✓ round-trip succeeded — fnox keychain works on ${{ matrix.os }} GHA runners"
          else
            echo "✗ mismatch — expected: $EXPECTED, got: $ACTUAL"
            exit 1
          fi

          echo "→ cleanup"
          mise exec -- fnox remove TEST_FNOX_WIN_PROOF --global || true

      - name: fnox keychain skipped on Linux (gnome-keyring not on Ubuntu GHA)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: echo "⤬ Linux secret-service requires gnome-keyring + dbus — skipped. Use age provider for Linux CI."

      # Parse-check every nu task script. This proves all our shared nu scripts
      # are syntactically valid on every OS — the SSOT promise: same script
      # runs on macOS, Linux, Windows desktops + CI.
      #
      # nu --ide-check returns parse errors in JSON to stdout if any.
      # Empty stdout = clean parse. Non-zero exit = error.
      - name: Parse-check every nu task script
        shell: 'mise exec -- nu --no-newline {0}'
        run: |
          # Find every file under mise-tasks/ whose first line is the nu shebang.
          let nu_files = (
            ls **/*
            | where type == file
            | get name
            | where { |p|
                ($p | str starts-with "mise-tasks/")
                and (not ($p | str ends-with ".md"))
                and ((open --raw $p | lines | first) == "#!/usr/bin/env nu")
              }
          )

          mut fail = false
          for f in $nu_files {
            print $"→ ($f)"
            let result = (^mise exec -- nu --ide-check 1 $f | complete)
            let combined = $"($result.stdout)($result.stderr)"
            # ide-check emits JSON; lines with "type":"diagnostic" are parse errors
            if ($combined | str contains '"type":"diagnostic"') {
              print $"✗ parse errors in ($f):"
              print $combined
              $fail = true
            }
          }
          if $fail { exit 1 }
          print $"✓ all nu scripts parse cleanly \(($nu_files | length) files\)"

      # Real execution: run each task with no env, expect the friendly
      # "missing prerequisite" error path. Proves every task EXECUTES on
      # each OS — not just parses. Catches runtime nu bugs (wrong field
      # access, undefined commands, type errors) that --ide-check misses.
      #
      # Why negative-path: positive paths require real CF tokens / bw vault /
      # gh secrets — those are integration tests for a separate workflow.
      # Negative paths are pure self-test.
      # Use nu itself for this step — dogfood the SSOT story in CI.
      # Bypasses macOS bash 3.2 limits (no declare -A, etc.) and demonstrates
      # 'shell: nu' working on every runner.
      - name: Negative-path execution test (every task, every OS)
        shell: 'mise exec -- nu --no-newline {0}'
        env:
          CLOUDFLARE_API_TOKEN: ""
          BW_SESSION: ""
          FNOX_SYNC_KEYS: ""
          MISE_ENV: __nonexistent__
        run: |
          # Ensure fnox config exists on every OS (Linux skipped the keychain
          # step). Idempotent.
          try { ^mise exec -- fnox init --global } catch { }
          for k in ["BW_SESSION", "CLOUDFLARE_API_TOKEN"] {
            try { ^mise exec -- fnox remove $k --global } catch { }
          }

          # Expected error message per task — first guard each script hits
          # under empty env. Some bw scripts check the bw binary first
          # (.github CI doesn't have bw in [tools]); others check fnox first.
          let cases = [
            { task: "bw/list",                  want: "no BW_SESSION" },
            { task: "bw/status",                want: "bw CLI not found" },
            { task: "bw/diff",                  want: "no BW_SESSION" },
            { task: "bw/sync",                  want: "no BW_SESSION" },
            { task: "bw/migrate-from-keychain", want: "no BW_SESSION" },
            { task: "bw/unlock",                want: "bw CLI not found" },
            { task: "bw/bootstrap",             want: "bw CLI not found" },
            { task: "cf/token-check",           want: "not set and not in fnox" },
            { task: "secrets/sync-github",      want: "FNOX_SYNC_KEYS not set" },
            { task: "env/resolve",              want: "not found" },
            { task: "release",                  want: "usage: mise run release" },
            { task: "rust/wasm-pack",           want: "usage: mise run rust:wasm-pack" },
          ]

          mut fail = 0
          for c in $cases {
            print $"→ ($c.task)  \(expect exit≠0 + '($c.want)' in output\)"
            let result = (^mise exec -- nu $"mise-tasks/($c.task)" | complete)
            let combined = $"($result.stdout)($result.stderr)"
            if ($combined | str contains $c.want) and ($result.exit_code != 0) {
              print $"  ✓ exit=($result.exit_code)"
            } else {
              print $"  ✗ FAIL  exit=($result.exit_code)"
              print $"    got: ($combined | str substring 0..200)"
              $fail = 1
            }
          }

          if $fail == 0 {
            print ""
            let host = (sys host | get name)
            print $"✓ all negative-path tests passed on ($host)"
          } else {
            exit 1
          }
