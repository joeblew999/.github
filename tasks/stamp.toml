# tasks/stamp.toml — stamp the joeblew999/.github wiring + claude skills into a
# consumer repo. Run INSIDE the consumer repo. Idempotent; pinned by --ref.
#
# Stamps:
#   - .claude/skills/*            ← .github/.claude/skills/*   (Claude Code skills)
#   - .github/workflows/mise.yaml ← .github/templates/mise.yaml (reusable-CI stub, @ref rendered)
#   - prints the [task_config].includes block to add to mise.toml
#
# Consumer wiring:
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/.github.git//tasks/stamp.toml?ref=<tag>"]

["stamp:repo"]
description = "Stamp the .github CI workflow + claude skills into THIS repo from a pinned .github. Usage: mise run stamp:repo [-- --ref vX.Y.Z]"
run = '''
#!/usr/bin/env nu
def main [--ref: string = "main"] {
  let url = "https://github.com/joeblew999/.github.git"
  let tmp = (^mktemp -d | str trim)
  print $"→ fetching .github@($ref)"
  ^git clone --quiet --depth 1 --branch $ref $url $tmp

  # 1. Claude skills ----------------------------------------------------------
  let src = ($tmp | path join ".claude" "skills")
  if ($src | path exists) {
    mkdir .claude/skills
    for s in (glob ($src | path join "*")) {
      cp -r $s .claude/skills/
      print $"  ✓ skill: ($s | path basename)"
    }
  } else {
    print "  • no .claude/skills in .github"
  }

  # 2. CI workflow stub (render the @ref) -------------------------------------
  let tpl = ($tmp | path join "templates" "mise.yaml")
  if ($tpl | path exists) {
    mkdir .github/workflows
    open --raw $tpl | str replace --all "{{REF}}" $ref | save -f .github/workflows/mise.yaml
    print "  ✓ .github/workflows/mise.yaml"
  }

  ^rm -rf $tmp

  # 3. Includes block to paste into mise.toml ---------------------------------
  print ""
  print $"Add to mise.toml [task_config].includes \(pick the namespaces you use, all @($ref)\):"
  for ns in ["mise" "release" "ci"] {
    print $'  "git::https://github.com/joeblew999/.github.git//tasks/($ns).toml?ref=($ref)",'
  }
  print ""
  print $"✓ stamped from .github@($ref). Next: add the includes above, then `mise run mise:global`."
}
'''
