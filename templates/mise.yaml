# Stamped by `mise run stamp:repo` from joeblew999/.github. Runs `mise run <task>`
# across the OS matrix via the shared reusable workflow. Adjust `task`/`os-matrix`
# /branches for this repo; re-run stamp:repo to bump the @ref.
name: mise CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@{{REF}}
    with:
      task: ci
      os-matrix: '["ubuntu-latest"]'
      sccache: true
      cargo-lock-path: Cargo.lock
