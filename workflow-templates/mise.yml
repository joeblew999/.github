name: mise CI

# Bootstrapped from joeblew999/.github workflow-templates (Actions → New workflow).
# Calls the shared reusable-mise-ci workflow to run ONE mise task across the OS
# matrix. Pin @main to a tag (e.g. @v0.39.0) for reproducibility; the scheduled
# mise-upgrade PR keeps it current.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@main
    with:
      task: ci
      os-matrix: '["ubuntu-latest"]'
      sccache: true
