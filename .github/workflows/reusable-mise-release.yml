name: Reusable Mise Release

# ▸ Multi-OS binary release, isomorphic with local. Same idea as reusable-mise-ci:
# each OS in the matrix runs the SAME `mise run <build-task>` it would run locally
# (so NO cross-compile — each native runner builds its own arch), packs assets via
# the shared `release:pack`, and a final job attaches them all to the tag via the
# shared `release:publish`. Call it from a repo's .github/workflows/<name>.yml on a
# tag push:
#
#   on:
#     push:
#       tags: ['v*']
#   jobs:
#     release:
#       permissions:
#         contents: write                # REQUIRED on the CALLER — see below.
#         packages: write                # ONLY when docker-image: true (image push).
#       uses: joeblew999/.github/.github/workflows/reusable-mise-release.yml@vX.Y.Z
#       with:
#         build-task: dist                 # mise task that stages dist/<name>/<bin>
#         os-matrix: '["ubuntu-latest", "macos-latest"]'
#
# PERMISSIONS: the publish job creates a GitHub release, which needs a
# `contents: write` token. A reusable workflow CANNOT elevate the caller's token —
# it can only narrow it — so the publish job's own `permissions:` block (below) is
# a CEILING, not a grant. The caller MUST grant `contents: write`. For a docker
# image push (`docker-image: true`) it ALSO grants `packages: write`; the `image`
# job declares NO permissions of its own and inherits the caller's, so a non-docker
# caller needs only `contents: write` and never startup_failures. No PAT or secret
# is needed — the default `GITHUB_TOKEN` suffices. `mise:repo:bootstrap --release`
# writes a stub with the right grant for each mode.
#
# The repo defines `build-task` (default `dist`) to build for the HOST arch into
# the pack dir; `release:pack` + `release:publish` come from tasks/release.toml.

on:
  workflow_call:
    inputs:
      build-task:
        description: 'mise task that builds + stages this host''s arch into <pack-dir>/<name>/'
        type: string
        default: 'dist'
      os-matrix:
        description: 'JSON array of GH runners — one native build per arch (no cross-compile)'
        type: string
        default: '["ubuntu-latest", "macos-latest"]'
      pack-dir:
        description: 'Staging dir release:pack archives (each immediate subdir → one tar.gz)'
        type: string
        default: 'dist'
      mise-version:
        description: 'mise binary version to install'
        type: string
        default: '2026.5.1'
      docker-image:
        description: 'ALSO build + push a docker image to GHCR on this tag (caller must grant packages:write)'
        type: boolean
        default: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@v5

      # Shared setup. rust-cache: true here is the whole point -- the release
      # build compiles the binary, so it must reuse ~/.cargo + target/ (it used
      # to compile cold every tag because this workflow hand-rolled setup and
      # never got the rust-cache that ci had).
      - uses: joeblew999/.github/.github/actions/mise-setup@main
        with:
          cache-key: mise-release-${{ matrix.os }}-${{ hashFiles('mise.toml') }}
          rust-cache: true
          rust-cache-key: release

      - run: mise run ${{ inputs.build-task }}
      - run: mise run release:pack -- --dir ${{ inputs.pack-dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: ${{ inputs.pack-dir }}/*.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git-cliff needs full history for release notes

      # Shared setup. No rust-cache: this job only packs/publishes (git-cliff +
      # gh from the global toolset), it doesn't compile.
      - uses: joeblew999/.github/.github/actions/mise-setup@main
        with:
          cache-key: mise-release-publish-${{ hashFiles('mise.toml') }}

      - uses: actions/download-artifact@v8
        with:
          path: ${{ inputs.pack-dir }}
          pattern: release-assets-*
          merge-multiple: true

      # release:publish creates the release for the pushed tag (if missing) and
      # attaches every arch's tar.gz, verifying the upload count.
      - run: mise run release:publish -- "${{ github.ref_name }}" ${{ inputs.pack-dir }}/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  # Optional: build + push a RUNNABLE docker image to GHCR on the tag. Off unless
  # the caller sets `docker-image: true` (and grants `packages: write`). Image name
  # is derived from origin → ghcr.io/<owner>/<repo>:<tag>. Auth = default GITHUB_TOKEN.
  image:
    name: image (ghcr)
    if: ${{ inputs.docker-image }}
    runs-on: ubuntu-latest
    # NO permissions block on purpose. A reusable job that declares one is validated
    # against the caller's grant at STARTUP even when skipped — so declaring
    # `packages: write` here would make every NON-docker caller (which grants only
    # contents:write) startup_failure. With no block, this job inherits the caller's
    # token: a docker caller grants contents+packages:write (so the push works);
    # a non-docker caller grants only contents:write and this job is skipped anyway.
    steps:
      - uses: actions/checkout@v5

      # Enables multi-arch (arm64) builds when the repo sets CI_DOCKER_PLATFORMS;
      # harmless for the single-arch default.
      - uses: docker/setup-qemu-action@v3

      # Shared setup. No rust-cache: the build happens inside docker, not here.
      - uses: joeblew999/.github/.github/actions/mise-setup@main
        with:
          cache-key: mise-release-image-${{ hashFiles('mise.toml') }}

      # docker:image reads $CI_DOCKERFILE / $CI_DOCKER_CONTEXT / $CI_DOCKER_PLATFORMS
      # from the repo's mise.toml [env] (default Dockerfile / . / linux/amd64).
      - run: mise run docker:image -- "${{ github.ref_name }}"
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
