[task_config]
# Self-hosting: include every tasks/*.toml file so the lib can run its
# own ci:check-nu etc. against itself. mise doesn't auto-discover
# tasks/ (only mise-tasks/, mise/tasks/, .mise/tasks/), so list explicitly.
#
# Releases use release:github (tasks/release.toml). NAMESPACE = TOOL: cliff:* is
# git-cliff only; release:* is the release orchestration (cliff+git+gh); ci:* is
# all CI guards; docker:* is docker. No task lives in another tool's namespace.
includes = [
  "tasks/secrets-bw.toml",
  "tasks/tool-cf.toml",
  "tasks/ci.toml",
  "tasks/tool-cliff.toml",
  "tasks/tool-docker.toml",
  "tasks/tool-fnox.toml",
  "tasks/tool-gh.toml",
  "tasks/mise.toml",
  "tasks/mobile.toml",
  "tasks/cfapp.toml",
  "tasks/release.toml",
  "tasks/tool-rust.toml",
  "tasks/secrets.toml",
  "tasks/tool-wrangler.toml",
]

[tools]
fnox                     = "latest"
"github:nushell/nushell" = "latest"   # pinned — bw:* shared tasks are nu (cross-platform; bash unavailable on Windows)
gh                       = "latest"
jq                       = "latest"
usage                    = "latest"
git-cliff                = "latest"  # cliff:* changelog/release-intel tasks
# lightweight CLIs fronted by their namespace — pulled from global, never pinned per-task.
# (Heavy/niche toolchains — java/ruby/cocoapods/tauri-cli/wasm-pack — stay per-task in mobile:*/rust:*.)

# ── Dogfood ──────────────────────────────────────────────────────────────────
# .github eats its own dog food the SAME way a consumer does: a LOCAL `ci` that
# extends the shared guards (mise MERGES same-named tasks) with a self-test that
# EXERCISES credential-free lib tasks cross-OS — not just parses them. Runs on
# the matrix via .github/workflows/mise.yml.
[tasks.ci]
depends = ["dogfood"]

[tasks.dogfood]
run = '''
#!/usr/bin/env nu

def main [] {
  # 1. orchestration→primitive composition via `mise run` stdout capture
  #    (the exact pattern cfapp:* uses to capture cf:* output).
  let c = (^mise run _probe | complete | get stdout | str trim)
  if $c != "DOGFOOD-OK" {
    print --stderr $"✗ mise-run composition broke — captured [($c)]"
    exit 1
  }

  # 2. exercise the real archiver (release:pack → tar) on a throwaway fixture.
  let stage = (mktemp -d)
  mkdir ($stage | path join "demo_1.0.0_linux_amd64")
  "x" | save -f ($stage | path join "demo_1.0.0_linux_amd64" "bin")
  ^mise run release:pack -- --dir $stage
  if not (($stage | path join "demo_1.0.0_linux_amd64.tar.gz") | path exists) {
    print --stderr "✗ release:pack produced no archive"
    rm -rf $stage
    exit 1
  }
  rm -rf $stage

  # 3. the README's task tables are GENERATED from tasks/ — fail if they drifted.
  ^mise run "docs:check"

  # 4. RUN docker:build (parse-check can't render Tera; only `mise run` does — this
  #    catches the double-brace-in-a-task-body class of bug). It builds on the ubuntu
  #    cell and capability-skips on macOS/Windows — either way the body is executed.
  let df = (mktemp -d)
  "FROM alpine:3.20\nCMD [\"true\"]\n" | save -f ($df | path join "Dockerfile")
  ^mise run docker:build -- --dockerfile ($df | path join "Dockerfile") --context $df
  rm -rf $df

  print $"✓ dogfood — ($nu.os-info.name): composition + release:pack + docs-in-sync + docker:build"
}
'''

# Trivial PRIMITIVE the dogfood composes (same shape as a cf:* primitive).
[tasks._probe]
run = '''
#!/usr/bin/env nu
print "DOGFOOD-OK"
'''

# ── docs:gen / docs:check ─────────────────────────────────────────────────────
# The README's two-layer tables are GENERATED from tasks/*.toml — each file's
# `# role:` header line is the SSOT. docs:gen rewrites the block between the
# <!-- gen:tasks --> markers; docs:check (run by dogfood) fails if it's stale.
# So a rename/add/remove of a task file can never leave the README drifting.
[tasks."docs:gen"]
description = "Regenerate the README two-layer tables from tasks/*.toml (# role: headers)."
run = '''
#!/usr/bin/env nu

def task-rows [] {
  let root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  glob ($"($root)/tasks/*.toml" | str replace --all "\\" "/")
  | sort
  | each {|f|
      let base = ($f | path basename | str replace ".toml" "")
      let layer = (if ($base | str starts-with "tool-") { "tool" } else if ($base == "mise") { "runner" } else { "orchestration" })
      let role = (
        open --raw $f | lines | where {|l| ($l | str trim | str starts-with "# role:") }
        | get 0? | default "" | str replace --regex '^#\s*role:\s*' '' | str trim
      )
      {file: $base, layer: $layer, role: $role}
    }
}

def gen-block [] {
  let r = (task-rows)
  let nl = (char newline)
  mut o = ["### Tool layer — `tool-*.toml` (pure primitives — drive only their own tool)" "" "| file | role |" "|---|---|"]
  for x in ($r | where layer == "tool") { $o = ($o | append $"| `($x.file)` | ($x.role) |") }
  $o = ($o | append ["" "### Orchestration layer — plain `*.toml` (compose tool tasks)" "" "| namespace | role |" "|---|---|"])
  for x in ($r | where layer == "orchestration") { $o = ($o | append $"| `($x.file)` | ($x.role) |") }
  for x in ($r | where layer == "runner") { $o = ($o | append ["" $"Runner: **`($x.file)`** — ($x.role)."]) }
  $o | str join $nl
}

def main [] {
  let root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  let readme = ($root | path join "README.md")
  let txt = (open --raw $readme)
  let s = "<!-- gen:tasks -->"
  let e = "<!-- /gen:tasks -->"
  let before = ($txt | split row $s | get 0)
  let after = ($txt | split row $e | last)
  let nl = (char newline)
  $"($before)($s)($nl)($nl)(gen-block)($nl)($nl)($e)($after)" | save --force $readme
  print "✓ README task tables regenerated"
}
'''

[tasks."docs:check"]
description = "Fail if the README task tables are stale vs tasks/ (regenerate with docs:gen)."
run = '''
#!/usr/bin/env nu
def main [] {
  let readme = (($env.MISE_PROJECT_ROOT? | default (pwd)) | path join "README.md")
  let before = (open --raw $readme)
  ^mise run "docs:gen"            # rewrites only the <!-- gen:tasks --> block
  let after = (open --raw $readme)
  # Compare line-ending-insensitively: Windows checks out CRLF but docs:gen
  # writes LF, so a raw compare false-positives "stale". Content is what matters.
  let norm = {|s| $s | str replace --all "\r\n" "\n" }
  let stale = ((do $norm $before) != (do $norm $after))
  $before | save --force $readme    # always restore raw bytes (git-state-independent)
  if $stale {
    print --stderr "✗ README task tables are STALE — run `mise run docs:gen` and commit."
    exit 1
  }
  print "✓ README task tables in sync with tasks/"
}
'''
