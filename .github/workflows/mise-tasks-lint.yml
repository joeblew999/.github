name: mise-tasks lint

on:
  push:
    branches: [main]
    paths: ["mise-tasks/**", "mise.toml", ".github/workflows/mise-tasks-lint.yml"]
  pull_request:
    paths: ["mise-tasks/**", "mise.toml", ".github/workflows/mise-tasks-lint.yml"]
  workflow_dispatch:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      # mise is the SSOT for all tool versions — reads mise.toml
      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Verify tasks load
        shell: bash
        run: mise tasks ls

      - name: Verify task scripts are executable and well-formed
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            if [ ! -x "$f" ]; then
              echo "✗ not executable: $f"
              fail=1
            fi
            # Accept either bash or nu shebang (nushell migration in progress —
            # see project_nushell_migration.md). Files under _proof/ are
            # cross-platform smoke tests, not invokable mise tasks.
            shebang=$(head -1 "$f")
            case "$shebang" in
              '#!/usr/bin/env bash'|'#!/usr/bin/env nu') : ;;
              *) echo "✗ unsupported shebang ($shebang): $f"; fail=1 ;;
            esac
            # Tasks (not _proof smoke tests) must have a #MISE description= header
            case "$f" in
              mise-tasks/_proof/*) : ;;
              *)
                if ! grep -q '^#MISE description=' "$f"; then
                  echo "✗ missing #MISE description= header: $f"
                  fail=1
                fi
                ;;
            esac
          done < <(find mise-tasks -type f ! -name "README.md" ! -name "*.md")
          [ "$fail" -eq 0 ] && echo "✓ all task files are executable and well-formed"
          exit "$fail"

      - name: Check for Tera-breaking syntax (bash files only)
        shell: bash
        run: |
          # Tera treats {# as a comment opener. Only bash uses ${#VAR}; nu has
          # different length syntax (str length / length).
          if find mise-tasks -type f -name '*.sh' -o -type f ! -name '*.nu' ! -name '*.md' \
               | xargs grep -l '\${#' 2>/dev/null | grep -v README; then
            echo "✗ found \${# syntax in a bash file — use wc -c / printf instead"
            exit 1
          fi
          echo "✓ no Tera-breaking syntax found"

      # Cross-platform proof: install nu via mise, run the proof script.
      # If this passes on all 3 OS legs, the nushell migration plan is
      # CI-validated for the joeblew999 org.
      # nushell + fnox are pinned in this repo's mise.toml [tools].
      # 'mise install' (run by mise-action above) installs them at those
      # pinned versions automatically — no need for ad-hoc 'mise use --global'.

      - name: Run nu cross-platform proof script
        shell: bash
        run: mise exec -- nu mise-tasks/_proof/nu-cross-platform.nu

      # fnox keychain provider proof — the question is whether GHA runners'
      # interactive logon sessions allow Credential Manager (Win) / Keychain
      # (mac) / secret-service (Linux) writes. fnox docs say "headless CI
      # not supported" — this step proves whether GHA's session-handling
      # qualifies as "interactive enough" for the real-world Windows desktop
      # user case we care about.
      #
      # Linux secret-service requires gnome-keyring + dbus, which Ubuntu
      # GHA runners don't have. The step is skipped there.
      - name: fnox keychain round-trip (macOS + Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail

          # Bootstrap empty fnox global config + keychain provider
          mise exec -- fnox init --global || true   # idempotent on already-init'd
          mise exec -- fnox provider add --global keychain keychain || true

          # Round-trip: set → get → assert match → remove
          EXPECTED='hello-from-${{ matrix.os }}-via-fnox-keychain'
          echo "→ writing TEST_FNOX_WIN_PROOF=$EXPECTED"
          printf '%s' "$EXPECTED" | mise exec -- fnox set --global -p keychain TEST_FNOX_WIN_PROOF

          echo "→ reading back via fnox get"
          ACTUAL=$(mise exec -- fnox get TEST_FNOX_WIN_PROOF)

          echo "→ asserting"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "✓ round-trip succeeded — fnox keychain works on ${{ matrix.os }} GHA runners"
          else
            echo "✗ mismatch — expected: $EXPECTED, got: $ACTUAL"
            exit 1
          fi

          echo "→ cleanup"
          mise exec -- fnox remove TEST_FNOX_WIN_PROOF --global || true

      - name: fnox keychain skipped on Linux (gnome-keyring not on Ubuntu GHA)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: echo "⤬ Linux secret-service requires gnome-keyring + dbus — skipped. Use age provider for Linux CI."

      # Parse-check every nu task script. This proves all our shared nu scripts
      # are syntactically valid on every OS — the SSOT promise: same script
      # runs on macOS, Linux, Windows desktops + CI.
      #
      # nu --ide-check returns parse errors in JSON to stdout if any.
      # Empty stdout = clean parse. Non-zero exit = error.
      - name: Parse-check every nu task script
        shell: bash
        run: |
          set -eu
          fail=0
          while IFS= read -r f; do
            echo "→ $f"
            output=$(mise exec -- nu --ide-check 1 "$f" 2>&1 || true)
            # ide-check emits one JSON object per error to stdout
            if [ -n "$output" ] && echo "$output" | grep -q '"type":"diagnostic"'; then
              echo "✗ parse errors in $f:"
              echo "$output"
              fail=1
            fi
          done < <(find mise-tasks -type f \
                        \( -name '*.nu' -o ! -name '*.md' \) \
                        -exec sh -c 'head -1 "$1" | grep -q "^#!/usr/bin/env nu"' _ {} \; \
                        -print)
          [ "$fail" -eq 0 ] && echo "✓ all nu scripts parse cleanly"
          exit "$fail"

      # Real execution: run each task with no env, expect the friendly
      # "missing prerequisite" error path. Proves every task EXECUTES on
      # each OS — not just parses. Catches runtime nu bugs (wrong field
      # access, undefined commands, type errors) that --ide-check misses.
      #
      # Why negative-path: positive paths require real CF tokens / bw vault /
      # gh secrets — those are integration tests for a separate workflow.
      # Negative paths are pure self-test.
      - name: Negative-path execution test (every task, every OS)
        shell: bash
        env:
          # Wipe anything that might let a task escape its guard
          CLOUDFLARE_API_TOKEN: ""
          BW_SESSION: ""
          FNOX_SYNC_KEYS: ""
          MISE_ENV: __nonexistent__
        run: |
          set -eu
          fail=0
          # Expected error per task — varies because some tasks check for
          # the bw CLI before checking fnox state. .github CI doesn't have bw
          # in [tools] (it's only required by repos that use bw:* tasks),
          # so bw-checking tasks fail at "bw CLI not found".
          declare -A expected_substr=(
            [bw/list]="no BW_SESSION"
            [bw/status]="bw CLI not found"
            [bw/diff]="no BW_SESSION"
            [bw/sync]="no BW_SESSION"
            [bw/migrate-from-keychain]="no BW_SESSION"
            [bw/unlock]="bw CLI not found"
            [bw/bootstrap]="bw CLI not found"
            [cf/token-check]="not set and not in fnox"
            [secrets/sync-github]="FNOX_SYNC_KEYS not set"
            [env/resolve]="not found"
            [release]="usage: mise run release"
            [rust/wasm-pack]="usage: mise run rust:wasm-pack"
          )

          # Ensure fnox global config exists on every OS — Linux skipped the
          # keychain round-trip step above, so config may not be initialized.
          mise exec -- fnox init --global 2>/dev/null || true

          # Make sure no fnox secrets exist that would let bw:* tasks past
          # the guard. The keychain round-trip step above may have left
          # a clean state; double-check.
          for k in BW_SESSION CLOUDFLARE_API_TOKEN; do
            mise exec -- fnox remove "$k" --global 2>/dev/null || true
          done

          for task in "${!expected_substr[@]}"; do
            want="${expected_substr[$task]}"
            echo
            echo "→ $task  (expect exit≠0 + '$want' in output)"
            actual=$(mise exec -- nu "mise-tasks/$task" 2>&1 || true)
            ec=$(mise exec -- nu "mise-tasks/$task" >/dev/null 2>&1; echo $?)

            if echo "$actual" | grep -qF "$want" && [ "$ec" != "0" ]; then
              echo "  ✓ exit=$ec, message contains '$want'"
            else
              echo "  ✗ FAIL  exit=$ec"
              echo "    got: $(echo "$actual" | head -3)"
              fail=1
            fi
          done

          [ "$fail" -eq 0 ] && echo "" && echo "✓ all negative-path tests passed on $(uname -s)"
          exit "$fail"
