name: mise-tasks lint (legacy)

# Guards the legacy file-task tree under mise-tasks/. The TOML-task tree
# at tasks/ is exercised by tasks-toml-proof.yml — keep this workflow
# focused on legacy-only concerns:
#   - structural invariants (executable, shebang, #MISE description header)
#   - nu parse-check across all 3 OS
#   - cross-platform nu fixture (nu-cross-platform.nu)
#   - fnox keychain round-trip (Mac + Windows GHA runners)
#
# Negative-path execution + per-task tools propagation are owned by
# tasks-toml-proof.yml — do not re-introduce them here.

on:
  push:
    branches: [main]
    paths: ["mise-tasks/**", "mise.toml", ".github/workflows/mise-tasks-lint.yml"]
  pull_request:
    paths: ["mise-tasks/**", "mise.toml", ".github/workflows/mise-tasks-lint.yml"]
  workflow_dispatch:

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Verify tasks load
        shell: bash
        run: mise tasks ls

      - name: Verify legacy task scripts are executable + shebang + description header
        shell: bash
        run: |
          fail=0
          while IFS= read -r f; do
            if [ ! -x "$f" ]; then
              echo "✗ not executable: $f"
              fail=1
            fi
            shebang=$(head -1 "$f")
            case "$shebang" in
              '#!/usr/bin/env bash'|'#!/usr/bin/env nu') : ;;
              *) echo "✗ unsupported shebang ($shebang): $f"; fail=1 ;;
            esac
            case "$f" in
              mise-tasks/_proof/*) : ;;
              *)
                if ! grep -q '^#MISE description=' "$f"; then
                  echo "✗ missing #MISE description= header: $f"
                  fail=1
                fi
                ;;
            esac
          done < <(find mise-tasks -type f ! -name "README.md" ! -name "*.md")
          [ "$fail" -eq 0 ] && echo "✓ all legacy task files are executable and well-formed"
          exit "$fail"

      # Cross-platform nu proof. Runs the dedicated _proof fixture across
      # macOS + Linux + Windows. Documents the SSOT promise: same script
      # parses + runs identically on all 3 OS.
      - name: nu cross-platform proof
        shell: bash
        run: mise exec -- nu mise-tasks/_proof/nu-cross-platform.nu

      # fnox keychain round-trip on macOS + Windows GHA runners. Proves the
      # interactive logon assumption holds — Credential Manager (Win) and
      # Keychain (mac) accept writes from non-interactive CI sessions.
      # Linux secret-service requires gnome-keyring + dbus which Ubuntu
      # GHA doesn't have; skipped (use age provider for Linux CI).
      - name: fnox keychain round-trip (macOS + Windows)
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mise exec -- fnox init --global || true
          mise exec -- fnox provider add --global keychain keychain || true
          EXPECTED='hello-from-${{ matrix.os }}-via-fnox-keychain'
          printf '%s' "$EXPECTED" | mise exec -- fnox set --global -p keychain TEST_FNOX_WIN_PROOF
          ACTUAL=$(mise exec -- fnox get TEST_FNOX_WIN_PROOF)
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "✓ round-trip succeeded — fnox keychain works on ${{ matrix.os }} GHA runners"
          else
            echo "✗ mismatch — expected: $EXPECTED, got: $ACTUAL"
            exit 1
          fi
          mise exec -- fnox remove TEST_FNOX_WIN_PROOF --global || true

      - name: fnox keychain skipped on Linux (gnome-keyring not on Ubuntu GHA)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: echo "⤬ Linux secret-service requires gnome-keyring + dbus — skipped. Use age provider for Linux CI."

      # Parse-check every legacy nu task script. tasks/*.toml bodies are
      # parse-checked separately by ci:check-toml-tasks (self-hosted in
      # tasks-toml-proof.yml).
      - name: Parse-check every legacy nu task script
        shell: bash
        run: |
          set -eu
          fail=0
          while IFS= read -r f; do
            echo "→ $f"
            output=$(mise exec -- nu --ide-check 1 "$f" 2>&1 || true)
            if [ -n "$output" ] && echo "$output" | grep -q '"type":"diagnostic"'; then
              echo "✗ parse errors in $f:"
              echo "$output"
              fail=1
            fi
          done < <(find mise-tasks -type f \
                        \( -name '*.nu' -o ! -name '*.md' \) \
                        -exec sh -c 'head -1 "$1" | grep -q "^#!/usr/bin/env nu"' _ {} \; \
                        -print)
          [ "$fail" -eq 0 ] && echo "✓ all legacy nu scripts parse cleanly"
          exit "$fail"
