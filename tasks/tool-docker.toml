# tasks/docker.toml — shared Docker/ghcr release tooling for the joeblew999 fleet.
# role: Docker / ghcr — `docker`
#
# docker:build    — CI-safe build-ONLY verify (no push, no login, no secrets).
#                   Skips cleanly where docker isn't usable (macOS/Windows CI
#                   runners), so the SAME `mise run ci` stays green on every OS.
# docker:login    — auth to ghcr (generic).
# docker:pull     — consumer-side: login from $GHCR_TOKEN + pull (optionally run) a
#                   PRIVATE image; CR/LF-trimmed for uncloud-injected env.
# docker:image    — build + push a MULTI-ARCH image to ghcr and verify the
#                   manifest. Parameterized; image defaults to
#                   ghcr.io/<owner>/<repo> from origin. The repo preps its build
#                   context (e.g. copies per-arch binaries into .docker/) first,
#                   then calls this.
# docker:settings — open the ghcr package's visibility settings (UI-only).
#
# Consumer wiring:
#   [task_config]
#   includes = [ "git::https://github.com/joeblew999/.github.git//tasks/docker.toml?ref=<tag>" ]
#
# We generally run docker builds in GitHub Actions (easier than local multi-arch);
# these tasks work the same locally and in CI (GHCR_TOKEN/GHCR_USER from CI env or
# fnox keychain locally).

["docker:build"]
description = "CI-safe build-ONLY verify (no push/login/secrets). $DOCKER_BUILD (auto|ci|local|never) = local-vs-remote; $CI_DOCKERFILE / $CI_DOCKER_CONTEXT (default Dockerfile / .) = which Dockerfile. Builds wherever a linux daemon exists, else skips so one `ci` stays green on every OS."
run = '''
#!/usr/bin/env nu
def main [
  --tag: string = "ci-build:latest",   # local image tag (not pushed)
  --dockerfile: string = "",           # default: $CI_DOCKERFILE or "Dockerfile"
  --context: string = "",              # default: $CI_DOCKER_CONTEXT or "."
] {
  # WHERE — $DOCKER_BUILD (consumer sets it in mise.toml [env]); default `auto`
  # so a repo that sets nothing just works:
  #   auto / unset → build wherever capable (local AND remote)
  #   ci    → remote only (CI=true) · local → local only · never → never
  let policy = ($env.DOCKER_BUILD? | default "auto" | str downcase)
  let in_ci = ((($env.CI? | default "") == "true") or (($env.GITHUB_ACTIONS? | default "") == "true"))
  if not (match $policy { "never" => false, "ci" => $in_ci, "local" => (not $in_ci), _ => true }) {
    print $"· DOCKER_BUILD=($policy), in-CI=($in_ci) — build skipped by policy"
    return
  }

  # CAN it — a linux image needs a linux-capable daemon, else SKIP (exit 0) so ci
  # stays green: no binary (macOS runner) → skip; Windows-containers daemon → skip;
  # ubuntu runner / local Docker Desktop (OSType=linux) → build. `which` first so
  # an absent binary can't crash; read `docker info` TEXT (not --format — its
  # double-brace placeholders are Tera in a mise task body).
  if (which docker | is-empty) {
    print $"· no docker daemon on ($nu.os-info.name) — build skipped, fine in CI"
    return
  }
  let info = (do { ^docker info } | complete)
  if ($info.exit_code != 0) or (not ($info.stdout | str downcase | str contains "ostype: linux")) {
    print $"· no linux docker daemon on ($nu.os-info.name) — build skipped, fine in CI"
    return
  }
  # WHICH Dockerfile — one knob ($CI_DOCKERFILE / $CI_DOCKER_CONTEXT) shared with
  # docker:image, so build-verify and publish use the SAME file. Flag wins.
  let df  = (if ($dockerfile | is-not-empty) { $dockerfile } else { $env.CI_DOCKERFILE?    | default "Dockerfile" })
  let ctx = (if ($context    | is-not-empty) { $context }    else { $env.CI_DOCKER_CONTEXT? | default "." })
  ^docker build -t $tag -f $df $ctx
  print $"✓ docker build ok — ($tag) [($df)]"
}
'''

["docker:login"]
description = "Log docker into ghcr.io. Token from $GHCR_TOKEN (CI) or fnox keychain (local); needs write:packages."
run = '''
#!/usr/bin/env nu
def main [] {
  # token/user from $env (CI secrets, or the dev's fnox-exec/env). docker only drives docker.
  # `str trim` — uncloud appends \n to injected env values, which breaks `docker login`.
  let tok = ($env.GHCR_TOKEN? | default "" | str trim)
  let user = ($env.GHCR_USER? | default "" | str trim)
  if ($tok | is-empty) or ($user | is-empty) {
    print --stderr "✗ set GHCR_TOKEN + GHCR_USER in env (e.g. via fnox exec)"
    exit 1
  }
  $tok | ^docker login ghcr.io -u $user --password-stdin
}
'''

# ── docker:pull ──────────────────────────────────────────────────────────────
# Consumer-side: pull (and optionally RUN) a PRIVATE GHCR image with one command —
# logs in from $GHCR_TOKEN/$GHCR_USER (fnox locally; injected secret on a server /
# vm-uncloud) then pulls. Token is CR/LF-trimmed so uncloud's appended \n can't
# break login. A read:packages token can pull any of the owner's private images.
["docker:pull"]
description = "Pull (and optionally run) a private GHCR image: login from $GHCR_TOKEN/$GHCR_USER (CR/LF-trimmed for uncloud) + docker pull. Image derived from origin (sanitized) or --image. Usage: mise run docker:pull -- vX.Y.Z [--image ghcr.io/o/r] [--run]"
run = '''
#!/usr/bin/env nu
def main [
  tag: string,
  --image: string = "",   # default ghcr.io/<owner>/<repo> from origin (sanitized)
  --run,                  # also `docker run --rm` it after pulling
] {
  let img = (if ($image | is-not-empty) { $image } else {
    let slug = (^git remote get-url origin | str trim
      | str replace -r '.*github\.com[:/]' '' | str replace -r '\.git$' ''
      | str downcase | split row "/" | each {|p| $p | str replace -r '^[._-]+' '' } | str join "/")
    $"ghcr.io/($slug)"
  })
  let ref = $"($img):($tag)"
  # GHCR auth from env (fnox locally; injected on a server). Trim CR/LF — uncloud
  # appends \n to injected values, which otherwise breaks `docker login`. If no
  # creds are given, skip login and rely on existing docker auth (or a public
  # image) — so an already-logged-in dev just runs `mise run docker:pull`.
  let tok  = ($env.GHCR_TOKEN? | default "" | str trim)
  let user = ($env.GHCR_USER?  | default "" | str trim)
  if ($tok | is-not-empty) and ($user | is-not-empty) {
    $tok | ^docker login ghcr.io -u $user --password-stdin
  } else {
    print "· no GHCR_TOKEN — using existing docker auth (or public image)"
  }
  ^docker pull $ref
  print $"✓ pulled ($ref)"
  if $run { ^docker run --rm $ref }
}
'''

["docker:image"]
description = "Build + push an image to ghcr and verify the manifest. Image derived from origin (sanitized). $CI_DOCKERFILE / $CI_DOCKER_CONTEXT / $CI_DOCKER_PLATFORMS (default Dockerfile / . / linux/amd64) — shared with docker:build. Usage: mise run docker:image -- vX.Y.Z [--image] [--dockerfile] [--context] [--platforms]"
depends = ["docker:login"]
run = '''
#!/usr/bin/env nu
def main [
  tag: string,
  --image: string = "",        # default ghcr.io/<owner>/<repo> from origin (sanitized)
  --dockerfile: string = "",   # default: $CI_DOCKERFILE or "Dockerfile"
  --context: string = "",      # default: $CI_DOCKER_CONTEXT or "."
  --platforms: string = "",    # default: $CI_DOCKER_PLATFORMS or "linux/amd64" (multi-arch needs QEMU)
] {
  let df    = (if ($dockerfile | is-not-empty) { $dockerfile } else { $env.CI_DOCKERFILE?      | default "Dockerfile" })
  let ctx   = (if ($context    | is-not-empty) { $context }    else { $env.CI_DOCKER_CONTEXT?   | default "." })
  let plats = (if ($platforms  | is-not-empty) { $platforms }  else { $env.CI_DOCKER_PLATFORMS? | default "linux/amd64" })
  let img = (if ($image | is-empty) {
    # GHCR refs must be lowercase, and a path component can't start with . / _ / -
    # (so a repo named `.github-example` → `github-example`). Sanitize the derived
    # name; pass --image explicitly to override.
    let slug = (^git remote get-url origin | str trim
      | str replace -r '.*github\.com[:/]' '' | str replace -r '\.git$' ''
      | str downcase | split row "/" | each {|p| $p | str replace -r '^[._-]+' '' } | str join "/")
    $"ghcr.io/($slug)"
  } else { $image })
  let ref = $"($img):($tag)"

  # buildx with the docker-container driver (the default 'docker' driver can't
  # --push a manifest). Multi-arch (arm64) additionally needs QEMU on the runner.
  let has = ((do { ^docker buildx inspect jb-multiarch } | complete | get exit_code) == 0)
  if not $has { ^docker buildx create --name jb-multiarch --driver docker-container | ignore }
  ^docker buildx use jb-multiarch
  ^docker buildx build --platform $plats --push -t $ref -f $df $ctx

  let got = (^docker manifest inspect $ref | from json | get manifests.platform.architecture | sort | uniq)
  print $"✓ pushed ($ref) [($df)] — arches: ($got | str join ', ')"
}
'''

["docker:settings"]
description = "Open a ghcr package's visibility settings (UI-only). Usage: mise run docker:settings -- <package>"
run = '''
#!/usr/bin/env nu
def main [package: string] {
  let user = ($env.GHCR_USER? | default "")
  let url = $"https://github.com/users/($user)/packages/container/($package)/settings"
  let opener = (match $nu.os-info.name { "macos" => "open", "windows" => "start", _ => "xdg-open" })
  ^$opener $url
  print $"opened ($url)"
}
'''
