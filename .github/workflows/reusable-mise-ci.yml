name: Reusable Mise CI

# ▸ How this works (bootstrap, matrix, isomorphic local==CI): the repo ROOT README.md (SSOT).
# Reusable workflow — every joeblew999 repo can call this from its own
# .github/workflows/<name>.yml via:
#
#   jobs:
#     ci:
#       uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@vX.Y.Z
#       with:
#         task: ci                         # (default) name of the mise task to run
#         os-matrix: '["ubuntu-latest", "macos-latest", "windows-latest"]'
#         mise-version: 2026.5.1
#         sccache: true                    # set false if no Rust crate
#
# The task itself (e.g. `mise run ci`) is defined in the consuming repo,
# either inline in mise.toml or in mise-tasks/. SSOT: workflow runs ONE
# task; that task's depends graph fans out the work.

on:
  workflow_call:
    inputs:
      task:
        description: 'Name of the mise task to run'
        type: string
        default: 'ci'
      os-matrix:
        description: 'JSON array of GH runners (default linux/macos/windows)'
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      mise-version:
        description: 'mise binary version to install'
        type: string
        default: '2026.5.1'
      sccache:
        description: 'Enable the Rust build cache (Swatinem/rust-cache: ~/.cargo + target/). Set false for non-Rust repos. (Name kept for backward compat.)'
        type: boolean
        default: true
      cargo-lock-path:
        description: 'Deprecated/no-op — rust-cache auto-detects Cargo.lock. Kept for backward compat with callers that still pass it.'
        type: string
        default: 'Cargo.lock'
      timeout-minutes:
        description: 'Per-job timeout. Caps a hung task (a bad test can otherwise run to GitHub''s 6h default). Default 60 is generous enough for a legit cold windows compile; a timed-out run still saves its cache (cache-on-failure), so the retry is warmer. Lower it for fast repos.'
        type: number
        default: 60

jobs:
  run:
    name: ${{ inputs.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          version: ${{ inputs.mise-version }}
          install: true
          cache: true
          # Workaround for jdx/mise-action#382 — default cache key has
          # prefix-match collisions. Custom key on (job, os, mise.toml hash).
          cache_key: mise-${{ inputs.task }}-${{ matrix.os }}-${{ hashFiles('mise.toml') }}

      # Rust build cache: caches ~/.cargo/{registry,git} + target/ keyed on
      # Cargo.lock + rustc + job. The old ~/.cache/sccache cache was a no-op —
      # nothing ever wired RUSTC_WRAPPER=sccache, so the dir stayed empty and
      # every run did a full cold compile. rust-cache needs no wrapper and
      # caches the incremental target dir directly. Gated by the `sccache` input
      # (kept as the name for backward compat = "enable the Rust build cache").
      - name: Rust build cache
        if: ${{ inputs.sccache }}
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache per task so e.g. a lint-only job and a test job don't
          # clobber each other's target dir; os + rustc + Cargo.lock are keyed in
          # automatically by the action.
          key: ${{ inputs.task }}
          # Save the compiled target/ even when the job FAILS. Without this a
          # red (or first-time-flaky) run never reaches the save step, so its
          # cache stays empty and every retry re-compiles cold — the exact trap
          # that kept a cold windows runner cold for hours. With it, a failed
          # run still leaves a warm cache for the next attempt.
          cache-on-failure: "true"

      # Seed the runner's global toolset — the SAME mise task you run locally.
      # (Consumer must include tasks/mise.toml for mise:global:bootstrap.)
      - run: mise run mise:global:bootstrap

      # MISE_JOBS=1: run the task's `depends` graph serially. A `ci` task fans
      # out several cargo invocations (build / clippy / test); on a COLD cache
      # (e.g. a fresh windows runner) those parallel cargo processes fight the
      # package-cache + build-directory locks and effectively deadlock for
      # hours. Serial = only cargo's own internal parallelism, no
      # cross-invocation lock contention. Warm runs hit rust-cache (no compile)
      # so serialising costs ~0. CI-only — local `mise run` stays parallel.
      - run: mise run ${{ inputs.task }}
        env:
          MISE_JOBS: 1

      # SURFACE (don't fail) tracked-file changes left by the task. A task that
      # rewrites a committed fixture races other tasks and hides drift (this bit us:
      # a task regenerated a file a test read via include_str!). WARNING ONLY — many
      # repos legitimately regenerate tracked files in CI (codegen), and this must
      # not break them. A repo that wants it strict can assert clean in its own task.
      - name: Check the working tree is clean after CI
        shell: bash
        run: |
          if ! git diff --quiet; then
            echo "::warning::a CI task modified tracked file(s) — prefer a temp path, or commit the regenerated output:"
            git --no-pager diff --stat
          fi
