# tasks/cf.toml — cf:* (Cloudflare) namespace: PURE cloudflare PRIMITIVES.
#
# Each task drives ONLY wrangler (+ curl as HTTP plumbing). Tokens come from
# $env — the orchestration layer (provision:*) sets CLOUDFLARE_API_TOKEN from
# fnox; wrangler reads it automatically. NO fnox/gh here. The cross-tool CF
# Access flows moved to provision.toml (orchestration).
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/cf.toml?ref=<tag>",
#   ]

# ── cf:token-check ───────────────────────────────────────────────────────────
# Verify CLOUDFLARE_API_TOKEN is valid via /user/tokens/verify. Used as a
# precondition gate by deploy/prove tasks.
["cf:token-check"]
description = "verify CLOUDFLARE_API_TOKEN (from env) is valid via the CF API"
run = '''
#!/usr/bin/env nu

def main [] {
  # token comes from env (orchestration/dev provides it from fnox). curl is plumbing.
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "✗ CLOUDFLARE_API_TOKEN not set in env"
    exit 1
  }

  let result = (
    try {
      ^curl -sS -H $"Authorization: Bearer ($token)" "https://api.cloudflare.com/client/v4/user/tokens/verify" | from json
    } catch {
      {success: false}
    }
  )

  if ($result.success? | default false) {
    let status = ($result.result.status? | default "?")
    let id = ($result.result.id? | default "?")
    print $"✓ token valid \(id=($id) status=($status)\)"
  } else {
    print "✗ token invalid or expired"
    print ($result | to json)
    exit 1
  }
}
'''

# ── cf:d1-migrate ────────────────────────────────────────────────────────────
# Apply D1 migrations via wrangler. Pass-through wrapper.
["cf:d1-migrate"]
tools = { wrangler = "latest" }
description = "run D1 migrations"
run = '''
#!/usr/bin/env nu

def main [...args] {
  ^wrangler d1 migrations apply ...$args
}
'''

# ── cf:d1-create ─────────────────────────────────────────────────────────────
# PRIMITIVE: create a D1 database by name; print ONLY its id to stdout (status
# to stderr) so an orchestrator can capture it. NOT idempotent on its own —
# callers gate on existence (see provision:d1-r2).
["cf:d1-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create D1 database <name>; prints the new database_id to stdout."
run = '''
#!/usr/bin/env nu

def main [name: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (provision:*) provides it from fnox. This task drives ONLY wrangler.
  print --stderr $"Creating D1 database '($name)' ..."
  let out = (^wrangler d1 create $name | complete | get stdout)
  let parsed = ($out | parse --regex '"database_id"\s*:\s*"([0-9a-f-]{36})"|database_id\s*=\s*"([0-9a-f-]{36})"')
  if ($parsed | length) == 0 {
    print --stderr "ERROR: could not parse database_id from output:"
    print --stderr $out
    exit 1
  }
  let id = ($parsed | first | get capture0? | default ($parsed | first | get capture1?))
  print $id
}
'''

# ── cf:d1-exec ───────────────────────────────────────────────────────────────
# PRIMITIVE: run a SQL file against a remote D1 database (by name).
["cf:d1-exec"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: execute a SQL file against remote D1 <name> (wrangler d1 execute --remote --file)."
run = '''
#!/usr/bin/env nu

def main [name: string, file: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (provision:*) provides it from fnox. This task drives ONLY wrangler.
  ^wrangler d1 execute $name --remote $"--file=($file)"
}
'''

# ── cf:r2-create ─────────────────────────────────────────────────────────────
# PRIMITIVE: idempotently create an R2 bucket by name.
["cf:r2-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create R2 bucket <name> if it doesn't already exist."
run = '''
#!/usr/bin/env nu

def main [bucket: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (provision:*) provides it from fnox. This task drives ONLY wrangler.
  let listing = (try { ^wrangler r2 bucket list | complete | get stdout } catch { "" })
  if ($listing | str contains $bucket) {
    print $"✓ R2 bucket '($bucket)' already exists"
  } else {
    print $"Creating R2 bucket '($bucket)' ..."
    ^wrangler r2 bucket create $bucket
  }
}
'''

# ── cf:queue-create ──────────────────────────────────────────────────────────
# PRIMITIVE: idempotently create a Cloudflare Queue by name.
["cf:queue-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create Cloudflare Queue <name> if it doesn't already exist."
run = '''
#!/usr/bin/env nu

def main [name: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (provision:*) provides it from fnox. This task drives ONLY wrangler.
  let existing = (try { ^wrangler queues list | complete | get stdout } catch { "" })
  if ($existing | str contains $name) {
    print $"✓ Queue '($name)' already exists"
  } else {
    print $"Creating queue '($name)' ..."
    ^wrangler queues create $name
  }
}
'''

# ── cf:secret-put ────────────────────────────────────────────────────────────
# PRIMITIVE: push a Worker secret. Value comes from $env.CF_SECRET_VALUE
# (orchestration sets it from fnox — kept out of the arg list, so it never shows
# in the process table). Drives ONLY wrangler.
["cf:secret-put"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: wrangler secret put <worker-var> from $env.CF_SECRET_VALUE."
run = '''
#!/usr/bin/env nu

def main [worker_var: string] {
  let val = ($env.CF_SECRET_VALUE? | default "" | str trim)
  if ($val | is-empty) {
    print --stderr $"✗ CF_SECRET_VALUE not set in env for ($worker_var)"
    exit 1
  }
  print $"→ wrangler secret put ($worker_var)"
  $val | ^wrangler secret put $worker_var
}
'''
