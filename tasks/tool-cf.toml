# tasks/tool-cf.toml — cf:* (Cloudflare) namespace: PURE cloudflare PRIMITIVES.
# role: Cloudflare CLI — `wrangler` + `curl` (HTTP)
#
# Each task drives ONLY wrangler (+ curl as HTTP plumbing). Tokens come from
# $env — the orchestration layer (cfapp:*) sets CLOUDFLARE_API_TOKEN from
# fnox; wrangler reads it automatically. NO fnox/gh here. The cross-tool CF
# Access flows moved to cfapp.toml (orchestration).
#
# Profiling any Worker: cf:load (traffic) + cf:profile (capture) + cf:cpu-stats
# (per-version CPU) here; pprof:top (tool-pprof.toml) reads the capture; and
# cfapp:profile runs the whole flow in one command.
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/tool-cf.toml?ref=<tag>",
#   ]

# ── cf:token-check ───────────────────────────────────────────────────────────
# Verify CLOUDFLARE_API_TOKEN is valid via /user/tokens/verify. Used as a
# precondition gate by deploy/prove tasks.
["cf:token-check"]
description = "verify CLOUDFLARE_API_TOKEN (from env) is valid via the CF API"
run = '''
#!/usr/bin/env nu

def main [] {
  # token comes from env (orchestration/dev provides it from fnox). curl is plumbing.
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "")
  if ($token | is-empty) {
    print --stderr "✗ CLOUDFLARE_API_TOKEN not set in env"
    exit 1
  }

  let result = (
    try {
      ^curl -sS -H $"Authorization: Bearer ($token)" "https://api.cloudflare.com/client/v4/user/tokens/verify" | from json
    } catch {
      {success: false}
    }
  )

  if ($result.success? | default false) {
    let status = ($result.result.status? | default "?")
    let id = ($result.result.id? | default "?")
    print $"✓ token valid \(id=($id) status=($status)\)"
  } else {
    print "✗ token invalid or expired"
    print ($result | to json)
    exit 1
  }
}
'''

# ── cf:profile ───────────────────────────────────────────────────────────────
# PRIMITIVE: capture a CPU or heap profile of a deployed Worker (or one Durable
# Object instance) via the profiling API — curl only, no wrangler/node. Writes
# the gzipped pprof and prints its path to stdout. The API attaches to an
# already-running isolate and never invokes the Worker, so send traffic during
# the capture (cf:load). Token needs Workers Scripts Read.
#
# READ CPU CAPTURES BY SAMPLE COUNT (pprof:top), NOT `pprof -top`: each sample's
# value is the wall-clock gap since the previous one, and an idle isolate takes
# no samples, so idle time lands on whatever runs first after an `await`.
["cf:profile"]
description = "PRIMITIVE: capture a production CPU/heap pprof of Worker <name> (or one Durable Object) via the CF API; curl only."
run = '''
#!/usr/bin/env nu

def main [
  worker: string                  # Worker script name (for a DO: the Worker that owns the namespace)
  --profile-type: string = "cpu"  # cpu | heap
  --duration-ms: int = 10000      # capture window, 1000–50000
  --version-id: string = "deployed" # "deployed" = version taking most traffic now; "latest" = newest UPLOADED; or a version ID
  --namespace-id: string = ""     # Durable Object namespace ID (with --actor-id)
  --actor-id: string = ""         # Durable Object instance ID (64 hex chars)
  --out: string = ""              # default: <worker>-<type>-<timestamp>.pb.gz
] {
  # token + account come from env (orchestration/dev provides them from fnox).
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "" | str trim)
  let account = ($env.CLOUDFLARE_ACCOUNT_ID? | default "" | str trim)
  if ($token | is-empty) or ($account | is-empty) {
    print --stderr "✗ CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in env"
    exit 1
  }
  if $profile_type not-in ["cpu" "heap"] {
    print --stderr $"✗ --profile-type must be cpu or heap, got ($profile_type)"
    exit 1
  }
  if $duration_ms < 1000 or $duration_ms > 50000 {
    print --stderr $"✗ --duration-ms must be 1000–50000, got ($duration_ms)"
    exit 1
  }
  if ($namespace_id | is-empty) != ($actor_id | is-empty) {
    print --stderr "✗ a Durable Object capture needs both --namespace-id and --actor-id"
    exit 1
  }

  let version = if $version_id != "deployed" { $version_id } else {
    let d = (
      $"Authorization: Bearer ($token)"
      | ^curl -sS -H @- $"https://api.cloudflare.com/client/v4/accounts/($account)/workers/scripts/($worker)/deployments"
      | from json
    )
    if not ($d.success? | default false) or ($d.result.deployments? | default [] | is-empty) {
      print --stderr $"✗ cannot resolve the deployed version of ($worker): ($d.errors? | default [] | to json --raw)"
      exit 1
    }
    $d.result.deployments | first | get versions | sort-by percentage --reverse | first | get version_id
  }

  let is_do = not ($actor_id | is-empty)
  let body = (
    {duration_ms: $duration_ms, profile_type: $profile_type}
    | merge (if $is_do { {namespace_id: $namespace_id, actor_id: $actor_id} } else { {} })
  )
  let stamp = (date now | format date "%Y%m%dT%H%M%S")
  let out = (if ($out | is-empty) { $"($worker)-($profile_type)-($stamp).pb.gz" } else { $out })
  let url = $"https://api.cloudflare.com/client/v4/accounts/($account)/workers/workers/($worker)/versions/($version)/profile"
  let target = (if $is_do { $"($worker)@($version | str substring 0..7) DO ($actor_id | str substring 0..7)…" } else { $"($worker)@($version | str substring 0..7)" })

  print --stderr $"→ capturing ($duration_ms) ms ($profile_type) profile of ($target) — send traffic now"
  # The auth header goes in on stdin (-H @-) so the token never shows in the process table.
  let code = (
    $"Authorization: Bearer ($token)"
    | ^curl -sS -X POST -H @- -H "Content-Type: application/json"
        --data ($body | to json --raw) --max-time ($duration_ms // 1000 + 60)
        -o $out -w "%{http_code}" $url
    | str trim
  )
  if $code != "200" {
    print --stderr $"✗ HTTP ($code)"
    if ($out | path exists) {
      let err = (open --raw $out | decode utf-8)
      print --stderr $err
      rm $out
      # 10393 / "no loaded isolate": the API only finds an isolate after sustained
      # traffic — a few seconds of warm-up was not enough in testing, ~20 s was.
      if ($err | str contains "10393") or ($err | str contains "no loaded isolate") {
        print --stderr "hint: keep traffic flowing for ~20 s BEFORE starting the capture (and during it), then retry"
      }
    }
    exit 1
  }
  print --stderr $"✓ ($out) — read with: mise run pprof:top -- ($out)   \(not plain `pprof -top`, see header\)"
  print $out
}
'''

# ── cf:cpu-stats ─────────────────────────────────────────────────────────────
# PRIMITIVE: per-version CPU + wall-time quantiles of a Worker from the GraphQL
# Analytics API (workersInvocationsAdaptive) — the ground truth for "what does
# a request cost", independent of profiler sampling. Use it for before/after:
# each deployed version gets its own row. curl only. Token needs Account
# Analytics Read. Values in microseconds; data lands ~1–2 min after traffic.
["cf:cpu-stats"]
description = "PRIMITIVE: per-version CPU/wall-time quantiles (µs) of Worker <name> from GraphQL Analytics; curl only. Before/after ground truth."
run = '''
#!/usr/bin/env nu

def main [
  worker: string                    # Worker script name
  --since: string = "1hr"           # look-back window (nu duration, e.g. 30min, 6hr, 1day)
  --by: string = "datetimeHour"     # time bucket: datetimeMinute | datetimeFifteenMinutes | datetimeHour
  --json                            # emit JSON instead of a table
] {
  let token = ($env.CLOUDFLARE_API_TOKEN? | default "" | str trim)
  let account = ($env.CLOUDFLARE_ACCOUNT_ID? | default "" | str trim)
  if ($token | is-empty) or ($account | is-empty) {
    print --stderr "✗ CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in env"
    exit 1
  }
  let fmt = "%Y-%m-%dT%H:%M:%SZ"
  let end = (date now | date to-timezone UTC | format date $fmt)
  let start = ((date now) - ($since | into duration) | date to-timezone UTC | format date $fmt)
  let q = $"query{viewer{accounts\(filter:{accountTag:\"($account)\"}\){workersInvocationsAdaptive\(limit:500,filter:{scriptName:\"($worker)\",datetime_geq:\"($start)\",datetime_leq:\"($end)\"},orderBy:[($by)_ASC]\){sum{requests errors}quantiles{cpuTimeP50 cpuTimeP75 cpuTimeP90 cpuTimeP99 wallTimeP50 wallTimeP99}dimensions{($by) scriptVersion status}}}}}"
  # The auth header goes in on stdin (-H @-) so the token never shows in the process table.
  let resp = (
    $"Authorization: Bearer ($token)"
    | ^curl -sS -X POST -H @- -H "Content-Type: application/json"
        --data ({query: $q} | to json --raw) "https://api.cloudflare.com/client/v4/graphql"
    | from json
  )
  if ($resp.errors? | default [] | is-not-empty) {
    print --stderr $"✗ ($resp.errors | to json --raw)"
    exit 1
  }
  let rows = ($resp.data.viewer.accounts.0.workersInvocationsAdaptive | each {|r| {
      t: ($r.dimensions | get $by)
      version: ($r.dimensions.scriptVersion | str substring 0..7)
      status: $r.dimensions.status
      requests: $r.sum.requests
      cpu_p50_us: $r.quantiles.cpuTimeP50
      cpu_p75_us: $r.quantiles.cpuTimeP75
      cpu_p90_us: $r.quantiles.cpuTimeP90
      cpu_p99_us: $r.quantiles.cpuTimeP99
      wall_p50_us: $r.quantiles.wallTimeP50
      wall_p99_us: $r.quantiles.wallTimeP99
    } })
  if $json { $rows | to json } else { $rows | to md }
}
'''

# ── cf:load ──────────────────────────────────────────────────────────────────
# PRIMITIVE: sustained HTTP traffic at one URL — N parallel curl loops for S
# seconds. cf:profile only attaches to an isolate that is already busy
# (~20–30 s of traffic first, and during the capture), and cf:cpu-stats needs
# enough requests per version for stable quantiles. Prints request count,
# rate and status-code breakdown. --data switches the default method to POST.
["cf:load"]
description = "PRIMITIVE: drive sustained traffic at <url> (N parallel curl loops for S seconds); prints count, rps, status codes."
run = '''
#!/usr/bin/env nu

def main [
  url: string
  --seconds: int = 60             # how long to keep the traffic up
  --parallel: int = 6             # concurrent request loops
  --method: string = ""           # default GET, or POST when --data is given
  --data: string = ""             # request body (e.g. '{}' for a ConnectRPC unary call)
  --content-type: string = "application/json"
] {
  let m = if ($method | is-not-empty) { $method } else if ($data | is-not-empty) { "POST" } else { "GET" }
  let body_args = if ($data | is-empty) { [] } else { [--data $data -H $"Content-Type: ($content_type)"] }
  let deadline = ((date now) + ($seconds * 1sec))
  print --stderr $"→ curl -X ($m) ($body_args | str join ' ') ($url) × ($parallel) for ($seconds)s"
  let codes = (
    1..$parallel | par-each {|_|
      mut counts = {}
      while (date now) < $deadline {
        # complete: a failed connection is status 000, not a task error.
        let code = (^curl -s -o /dev/null -w "%{http_code}" -X $m ...$body_args $url | complete | get stdout | str trim)
        $counts = ($counts | upsert $code (($counts | get -o $code | default 0) + 1))
      }
      $counts
    }
    | reduce --fold {} {|c, acc| $c | items {|k, v| {k: $k, v: $v} } | reduce --fold $acc {|kv, a| $a | upsert $kv.k (($a | get -o $kv.k | default 0) + $kv.v) } }
  )
  let total = ($codes | values | math sum | default 0)
  print $"($total) requests, ($total / $seconds | math round --precision 1) rps, status: ($codes | to json --raw)"
  # Error responses are cheap, so a profile or cpu-stats run over them measures
  # the error path (e.g. a 415 from a missing codec), not the real handler.
  let bad = ($codes | items {|k, v| {k: $k, v: $v} } | where {|r| not ($r.k | str starts-with "2") } | get v | math sum | default 0)
  if $bad > 0 {
    print --stderr $"⚠ ($bad)/($total) responses were not 2xx — profiles/cpu-stats of this run measure the error path"
  }
}
'''

# ── cf:d1-migrate ────────────────────────────────────────────────────────────
# Apply D1 migrations via wrangler. Pass-through wrapper.
["cf:d1-migrate"]
tools = { wrangler = "latest" }
description = "run D1 migrations"
run = '''
#!/usr/bin/env nu

def main [...args] {
  ^wrangler d1 migrations apply ...$args
}
'''

# ── cf:d1-create ─────────────────────────────────────────────────────────────
# PRIMITIVE: create a D1 database by name; print ONLY its id to stdout (status
# to stderr) so an orchestrator can capture it. NOT idempotent on its own —
# callers gate on existence (see cfapp:provision-d1-r2).
["cf:d1-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create D1 database <name>; prints the new database_id to stdout."
run = '''
#!/usr/bin/env nu

def main [name: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  print --stderr $"Creating D1 database '($name)' ..."
  let out = (^wrangler d1 create $name | complete | get stdout)
  let parsed = ($out | parse --regex '"database_id"\s*:\s*"([0-9a-f-]{36})"|database_id\s*=\s*"([0-9a-f-]{36})"')
  if ($parsed | length) == 0 {
    print --stderr "ERROR: could not parse database_id from output:"
    print --stderr $out
    exit 1
  }
  let id = ($parsed | first | get capture0? | default ($parsed | first | get capture1?))
  print $id
}
'''

# ── cf:d1-exec ───────────────────────────────────────────────────────────────
# PRIMITIVE: run a SQL file against a remote D1 database (by name).
["cf:d1-exec"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: execute a SQL file against remote D1 <name> (wrangler d1 execute --remote --file)."
run = '''
#!/usr/bin/env nu

def main [name: string, file: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  ^wrangler d1 execute $name --remote $"--file=($file)"
}
'''

# ── cf:r2-create ─────────────────────────────────────────────────────────────
# PRIMITIVE: idempotently create an R2 bucket by name.
["cf:r2-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create R2 bucket <name> if it doesn't already exist."
run = '''
#!/usr/bin/env nu

def main [bucket: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  let listing = (try { ^wrangler r2 bucket list | complete | get stdout } catch { "" })
  if ($listing | str contains $bucket) {
    print $"✓ R2 bucket '($bucket)' already exists"
  } else {
    print $"Creating R2 bucket '($bucket)' ..."
    ^wrangler r2 bucket create $bucket
  }
}
'''

# ── cf:queue-create ──────────────────────────────────────────────────────────
# PRIMITIVE: idempotently create a Cloudflare Queue by name.
["cf:queue-create"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: create Cloudflare Queue <name> if it doesn't already exist."
run = '''
#!/usr/bin/env nu

def main [name: string] {
  # wrangler reads CLOUDFLARE_API_TOKEN from env; the orchestration layer
  # (cfapp:*) provides it from fnox. This task drives ONLY wrangler.
  let existing = (try { ^wrangler queues list | complete | get stdout } catch { "" })
  if ($existing | str contains $name) {
    print $"✓ Queue '($name)' already exists"
  } else {
    print $"Creating queue '($name)' ..."
    ^wrangler queues create $name
  }
}
'''

# ── cf:secret-put ────────────────────────────────────────────────────────────
# PRIMITIVE: push a Worker secret. Value comes from $env.CF_SECRET_VALUE
# (orchestration sets it from fnox — kept out of the arg list, so it never shows
# in the process table). Drives ONLY wrangler.
["cf:secret-put"]
tools = { wrangler = "latest" }
description = "PRIMITIVE: wrangler secret put <worker-var> from $env.CF_SECRET_VALUE."
run = '''
#!/usr/bin/env nu

def main [worker_var: string] {
  let val = ($env.CF_SECRET_VALUE? | default "" | str trim)
  if ($val | is-empty) {
    print --stderr $"✗ CF_SECRET_VALUE not set in env for ($worker_var)"
    exit 1
  }
  print $"→ wrangler secret put ($worker_var)"
  $val | ^wrangler secret put $worker_var
}
'''
