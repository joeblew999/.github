# tasks/mise.toml — TOML-task definitions for the mise:* namespace.
# role: machine + repo bootstrap, sweep, upgrade
#
# Tasks:
#   mise:upgrade — thin wrapper around `mise upgrade --bump --local` that's
#                  safer than the bare command (won't bump the global config).
#   mise:sweep   — reclaim dead mise state (dead config links + unused tool
#                  versions) across every repo under --root. Safe: re-tracks
#                  all live configs first so prune can't over-delete.
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=<tag>",
#   ]

# ── mise:upgrade ─────────────────────────────────────────────────────────────
# Bump pinned tool versions in this repo's mise.toml. The `--local` flag
# is critical: without it, mise upgrade leaks bumps into the user's
# global ~/.config/mise/config.toml.
["mise:upgrade"]
description = "Bump pinned tool versions in this repo's mise.toml via `mise upgrade --bump --local`. Idempotent."
run = '''
#!/usr/bin/env nu

def main [
  --dry-run          # show what would change without writing
] {
  if $dry_run {
    print "→ mise upgrade --bump --local --dry-run"
    ^mise upgrade --bump --local --dry-run
    return
  }

  let project_root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  cd $project_root

  let before = (open --raw mise.toml)
  print "→ mise upgrade --bump --local"
  ^mise upgrade --bump --local

  let after = (open --raw mise.toml)
  if $before == $after {
    print "✓ nothing to upgrade — mise.toml unchanged"
    return
  }

  print ""
  print "✓ mise.toml bumped:"
  ^git --no-pager diff -- mise.toml
}
'''

# ── mise:sweep ───────────────────────────────────────────────────────────────
# Reclaim dead mise state across every repo under --root (default: $PWD):
#   1. Re-track every live mise config so `prune --tools` can't over-delete a
#      version a live-but-unvisited repo still pins.
#   2. `mise prune --configs` (dead repo links) + `mise prune --tools -y`.
# Removed tool versions auto-reinstall on demand for most backends.
# Use --dry-run to preview without deleting.
["mise:sweep"]
description = "Reclaim dead mise state (dead config links + unused tool versions) across all repos under --root. Re-tracks live configs first so prune stays safe. Idempotent."
run = '''
#!/usr/bin/env nu

def main [
  --root: string = ""   # workspace root to scan; defaults to $env.PWD
  --dry-run             # show what would be removed without deleting anything
] {
  let root = (if ($root | is-empty) { $env.PWD } else { $root })
  print $"→ scanning ($root) for mise configs"

  # Cross-platform glob: cd + RELATIVE forward-slash pattern; filter by path
  # COMPONENTS via `path split` (no OS-path in the glob, no separator assumptions).
  cd $root
  let cfgs = (
    glob "**/{mise,.mise}.toml"
    | where {|p| let parts = ($p | path split); ("target" not-in $parts) and (".git" not-in $parts) }
  )
  print $"  found ($cfgs | length) live configs — re-tracking so prune stays safe"

  for c in $cfgs {
    do { ^mise trust $c } | complete | ignore
    do { cd ($c | path dirname); ^mise ls --current } | complete | ignore
  }
  cd $root

  if $dry_run {
    print "→ mise prune --configs --dry-run"
    ^mise prune --configs --dry-run
    print "→ mise prune --tools --dry-run"
    ^mise prune --tools --dry-run
    print "(dry run — nothing deleted)"
    return
  }

  print "→ mise prune --configs"
  ^mise prune --configs
  print "→ mise prune --tools -y"
  ^mise prune --tools -y
  print "✓ sweep complete"
}
'''

# ── mise:global:bootstrap ──────────────────────────────────────────────────────────────
# Install the canonical COMMON toolset into the GLOBAL mise config — the single
# source of truth that every shared task inherits (nushell, fnox, gh, …). Plain
# `mise use -g` (no nushell needed, so it works on a bare runner), idempotent.
# Run it once locally; CI runs the SAME task. Keep this list in sync with the
# lib's own [tools] (ci:check-global guards it).
["mise:global:bootstrap"]
description = "Install the canonical common toolset into the global mise config (mise use -g). Run locally; CI runs it too. Idempotent."
run = "mise use -g github:nushell/nushell@latest fnox@latest gh@latest jq@latest usage@latest git-cliff@latest"

# ── mise:repo:bootstrap ──────────────────────────────────────────────────────
# COUNTERPART to mise:global:bootstrap: that seeds the MACHINE's tools, this seeds
# THIS repo's GitHub workflow stubs. ALL behaviour lives in the reusable workflows
# (reusable-mise-ci / reusable-mise-upgrade) — these stubs are thin glue that just
# `uses:` them and pass the per-repo inputs. The CI matrix is a stub knob: pass
# --os-matrix / --task / --sccache, or edit the generated file. Built line-by-line
# (no ${{ }}) so there's nothing for mise's Tera engine to choke on. Idempotent.
["mise:repo:bootstrap"]
description = "Generate .github/workflows/* stubs calling the joeblew999/.github reusable workflows. Settings persist in mise.toml [env] (CI_OS_MATRIX/CI_TASK/CI_SCCACHE/CI_RELEASE/CI_BUILD_TASK) so re-bootstrap keeps your overrides; flags win for one-off. Never writes mise.toml. Idempotent."
run = '''
#!/usr/bin/env nu

def main [
  --task: string = ""        # override the mise task (reusable default: ci)
  --os-matrix: string = ""   # override runners, e.g. '["ubuntu-latest"]' (reusable default: all 3 OSes)
  --sccache: string = ""     # override sccache: "true"/"false" (reusable default: true)
  --release                       # ALSO write mise-release.yml (tag-push binary release; opt-in)
  --build-task: string = ""       # with --release: the build task (reusable default: dist)
  --release-os-matrix: string = "" # with --release: which OSes publish binaries (reusable default: ubuntu+macos)
  --docker-image                  # with --release: ALSO build+push a GHCR image on tag (adds packages:write)
  --ref: string = ""              # @ref for the reusable workflows (default: this repo's own ?ref=)
] {
  let root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  let dir = ($root | path join ".github" "workflows")
  mkdir $dir

  # OVERRIDES PERSIST. Settings are read from mise.toml [env] (CI_TASK /
  # CI_OS_MATRIX / CI_SCCACHE / CI_RELEASE / CI_BUILD_TASK); a flag wins for a
  # one-off. So RE-bootstrap REPRODUCES a dev's choices instead of clobbering them.
  # And bootstrap ONLY ever writes .github/workflows/ — it NEVER touches mise.toml,
  # so [tasks.*] / [env] / depends overrides are always safe.
  let eff_task    = (if ($task      | is-not-empty) { $task }      else { $env.CI_TASK?      | default "" })
  let eff_os      = (if ($os_matrix | is-not-empty) { $os_matrix } else { $env.CI_OS_MATRIX? | default "" })
  let eff_sccache = (if ($sccache   | is-not-empty) { $sccache }   else { $env.CI_SCCACHE?   | default "" })
  let eff_release = ($release or (($env.CI_RELEASE? | default "" | str downcase) == "true"))
  let eff_build   = (if ($build_task | is-not-empty) { $build_task } else { $env.CI_BUILD_TASK? | default "" })
  let eff_rel_os  = (if ($release_os_matrix | is-not-empty) { $release_os_matrix } else { $env.CI_RELEASE_OS_MATRIX? | default "" })
  let eff_docker_image = ($docker_image or (($env.CI_DOCKER_IMAGE? | default "" | str downcase) == "true"))

  # PIN the reusable workflows to the SAME ref this repo pins its task includes to —
  # so a repo on ?ref=v0.48.0 gets `@v0.48.0` in its CI workflow, not a floating
  # `@main`. Order: --ref > $CI_REF > the ?ref= parsed from mise.toml > "main"
  # (the example pins ?ref=main, so it correctly stays @main).
  let mt = ($root | path join "mise.toml")
  let parsed_ref = (
    if ($mt | path exists) {
      (open --raw $mt | lines
       | where ($it =~ 'joeblew999/\.github\.git//') | where ($it =~ '\?ref=')
       | each {|l| $l | str replace --regex '.*\?ref=([^"]+).*' '${1}' }
       | get 0? | default "")
    } else { "" }
  )
  let eff_ref = (
    if ($ref | is-not-empty) { $ref }
    else if (($env.CI_REF? | default "") | is-not-empty) { ($env.CI_REF | str trim) }
    else if ($parsed_ref | is-not-empty) { $parsed_ref }
    else { "main" }
  )

  # The stub OVERRIDES only what's set — by default emits no `with:` and inherits
  # the reusable workflow's defaults (task=ci, all 3 OSes, sccache).
  mut with = []
  if ($eff_task    | is-not-empty) { $with = ($with | append $"      task: ($eff_task)") }
  if ($eff_os      | is-not-empty) { $with = ($with | append $"      os-matrix: '($eff_os)'") }
  if ($eff_sccache | is-not-empty) { $with = ($with | append $"      sccache: ($eff_sccache)") }

  mut ci_lines = [
    "name: mise CI"
    "# Generated by `mise run mise:repo:bootstrap`. Thin stub — the reusable workflow"
    "# owns the defaults (task=ci, all 3 OSes). Override per-repo via flags/edits."
    "on:"
    "  push:"
    "  pull_request:"
    "  workflow_dispatch:"
    ""
    "jobs:"
    "  ci:"
    $"    uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@($eff_ref)"
  ]
  if ($with | is-not-empty) { $ci_lines = ($ci_lines | append "    with:" | append $with) }
  let ci = (($ci_lines | append "") | str join "\n")

  let upgrade = ([
    "name: mise upgrade"
    "# Generated by `mise run mise:repo:bootstrap`. Weekly tool + ref bump PR."
    "on:"
    "  schedule:"
    '    - cron: "0 9 * * 1"'
    "  workflow_dispatch:"
    ""
    "permissions:"
    "  contents: write"
    "  pull-requests: write"
    ""
    "jobs:"
    "  upgrade:"
    $"    uses: joeblew999/.github/.github/workflows/reusable-mise-upgrade.yml@($eff_ref)"
    ""
  ] | str join "\n")

  $ci      | save --force ($dir | path join "mise.yml")
  $upgrade | save --force ($dir | path join "mise-upgrade.yml")

  # Opt-in tag-push binary release. Most repos don't ship binaries, so this is
  # only written with --release. The caller's `release:` job MUST grant
  # contents:write — a reusable workflow CANNOT elevate the default read-only
  # GITHUB_TOKEN, so the publish job startup_failures without it. Baked in here so
  # nobody hand-rolls it and gets the permissions wrong.
  mut wrote = "mise.yml + mise-upgrade.yml"
  if $eff_release {
    # REQUIRED — a reusable workflow can't elevate the caller's token, so the grant
    # MUST be here. BOTH contents:write AND packages:write, ALWAYS: the reusable's
    # `image` job statically declares `packages: write`, and GitHub validates that
    # ceiling at STARTUP even when the job is skipped (`if: docker-image` false). So
    # a non-docker release with only contents:write hits startup_failure. Granting
    # packages:write is harmless when no image is pushed (the job stays skipped).
    let perms = ["      contents: write" "      packages: write"]
    let rel_base = ([
      "name: mise release"
      "# Generated by `mise run mise:repo:bootstrap --release`. On tag push, each OS"
      "# builds its own arch (no cross-compile) and attaches binaries to the release."
      "on:"
      "  push:"
      '    tags: ["v*"]'
      "  workflow_dispatch:"
      ""
      "jobs:"
      "  release:"
      "    permissions:"
    ] | append $perms | append $"    uses: joeblew999/.github/.github/workflows/reusable-mise-release.yml@($eff_ref)")
    mut rel_with = []
    if ($eff_build  | is-not-empty) { $rel_with = ($rel_with | append $"      build-task: ($eff_build)") }
    if ($eff_rel_os | is-not-empty) { $rel_with = ($rel_with | append $"      os-matrix: '($eff_rel_os)'") }
    if $eff_docker_image            { $rel_with = ($rel_with | append "      docker-image: true") }
    let rel = (if ($rel_with | is-not-empty) { $rel_base | append "    with:" | append $rel_with } else { $rel_base })
    (($rel | append "") | str join "\n") | save --force ($dir | path join "mise-release.yml")
    $wrote = "mise.yml + mise-upgrade.yml + mise-release.yml"
  }
  print $"✓ wrote ($dir)/ → ($wrote) → reusable workflows @($eff_ref)"
}
'''

# ── mise:repo:bootstrap-delete ────────────────────────────────────────────────
# Remove the workflow stubs that mise:repo:bootstrap writes. .github owns this
# stub content, so it also owns removing it — e.g. to reset a repo before a fresh
# bootstrap, or to retire a renamed stub. Idempotent: absent files are a no-op.
["mise:repo:bootstrap-delete"]
description = "Remove the .github/workflows/* stubs written by mise:repo:bootstrap. Idempotent."
run = '''
#!/usr/bin/env nu

def main [] {
  let root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  let dir = ($root | path join ".github" "workflows")
  for f in ["mise.yml" "mise-upgrade.yml" "mise-release.yml"] {
    let p = ($dir | path join $f)
    if ($p | path exists) { rm $p; print $"✓ removed ($p)" } else { print $"· ($p) absent" }
  }
}
'''

