[settings]
# extends task-inheritance is mise experimental — joeblew999/.github
# v0.18+ uses it for per-namespace tools dedup (cf:_base, bw:_base, etc).
experimental = true

[task_config]
# Self-hosting: include every tasks/*.toml file so the lib can run its
# own ci:check-toml-tasks etc. against itself. mise doesn't auto-discover
# tasks/ (only mise-tasks/, mise/tasks/, .mise/tasks/), so list explicitly.
#
# (release is now mise:release in tasks/mise.toml; legacy mise-tasks/ removed.)
includes = [
  "tasks/bw.toml",
  "tasks/cf.toml",
  "tasks/ci.toml",
  "tasks/cliff.toml",
  "tasks/env.toml",
  "tasks/fnox.toml",
  "tasks/mise.toml",
  "tasks/mobile.toml",
  "tasks/prove.toml",
  "tasks/rust.toml",
  "tasks/secrets.toml",
  "tasks/wrangler.toml",
]

[tools]
fnox                     = "latest"
"github:nushell/nushell" = "latest"   # pinned — bw:* shared tasks are nu (cross-platform; bash unavailable on Windows)
gh                       = "latest"
jq                       = "latest"
usage                    = "latest"
git-cliff                = "latest"  # cliff:* changelog/release-intel tasks
