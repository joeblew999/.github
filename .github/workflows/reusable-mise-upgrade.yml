name: Reusable Mise upgrade

# ▸ How this works (bootstrap, matrix, isomorphic local==CI): the repo ROOT README.md (SSOT).
# Reusable workflow — every joeblew999 repo can call this from its own
# .github/workflows/<name>.yml via:
#
#   on:
#     schedule: [{cron: '0 9 * * 1'}]   # Mondays 09:00 UTC
#     workflow_dispatch:
#   permissions:
#     contents: write
#     pull-requests: write
#   jobs:
#     upgrade:
#       uses: joeblew999/.github/.github/workflows/reusable-mise-upgrade.yml@vX.Y.Z
#
# Calls `mise run mise:upgrade` (provided by joeblew999/.github mise-tasks
# library) which runs `mise upgrade --bump --local` and prints a diff.
# peter-evans/create-pull-request opens a PR if mise.toml changed.

on:
  workflow_call:
    inputs:
      mise-version:
        description: 'mise binary version to install'
        type: string
        default: '2026.5.1'
      pr-branch:
        description: 'Name of the branch the PR is opened from'
        type: string
        default: 'mise-upgrade'

jobs:
  upgrade:
    name: Upgrade pinned tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v4
        with:
          version: ${{ inputs.mise-version }}
          install: false   # we don't need the consumer's tools, just mise itself

      # mise:upgrade (and ci:audit-lib-refs) are NUSHELL tasks — install nu +
      # the global toolset first, or they exit 127 (nu not found). Plain
      # `mise use -g`, so it runs before nu exists.
      - name: mise run mise:global:bootstrap
        run: mise run mise:global:bootstrap

      - name: mise run mise:upgrade
        run: mise run mise:upgrade

      # Bump the joeblew999/.github ref pins too — ?ref= in mise.toml and
      # uses:…@vX in .github/workflows/* — so ONE PR covers tools + lib refs.
      # Skipped automatically if the repo doesn't include the ci namespace.
      - name: mise run ci:audit-lib-refs --write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if mise tasks ls 2>/dev/null | grep -q 'ci:audit-lib-refs'; then
            mise run ci:audit-lib-refs --write
          else
            echo "ci:audit-lib-refs not available (ci namespace not included) — skipping ref bump"
          fi

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(mise): bump pinned tools + joeblew999/.github refs"
          branch: ${{ inputs.pr-branch }}
          delete-branch: true
          title: "chore(mise): bump pinned tools + .github refs"
          body: |
            Automated weekly bump from the joeblew999/.github reusable workflow:

            - `mise run mise:upgrade` → pinned tool versions in `mise.toml`
            - `mise run ci:audit-lib-refs --write` → `?ref=` / `@ref` pins for
              joeblew999/.github in `mise.toml` + `.github/workflows/*`
              (rolling `@main` / `?ref=main` are left alone)

            Reproduce locally:

                mise run mise:upgrade --dry-run
                mise run ci:audit-lib-refs            # audit only
                mise run ci:audit-lib-refs --write    # apply
          add-paths: |
            mise.toml
            .github/workflows
          labels: dependencies, automated
