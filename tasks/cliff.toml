# tasks/cliff.toml — the cliff:* namespace: changelog + releases via git-cliff.
#
# git-cliff (orhun/git-cliff) maps conventional commits to release tags. It comes
# from the GLOBAL mise config (`mise run mise:global`) — tasks pin nothing.
#
# Read tasks work on THIS repo or any THIRD-PARTY repo (it reads a clone).
# cliff:release is the release driver for any repo that wants an auto-generated
# changelog — e.g. our uncloud fork.
#
# Consumer wiring:
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/.github.git//tasks/cliff.toml?ref=<tag>"]
#
# "Which release shipped commit X?" is plain git, not a task:
#   git tag --contains <merge-sha>      # empty = still unreleased

# ── cliff:release ────────────────────────────────────────────────────────────
# The release driver: regenerate CHANGELOG.md from conventional commits, commit
# it, tag, push branch + tag, and cut the GitHub release with the same notes.
# Optionally uploads binary assets (build them into a gitignored dir first).
# Local-only (no CI/goreleaser).
#   mise run cliff:release -- vX.Y.Z                    # changelog + tag + release
#   mise run cliff:release -- vX.Y.Z dist/app-*         # ...and upload binaries
["cliff:release"]
description = "git-cliff release: regenerate CHANGELOG.md, commit, tag, push, create the GitHub release, and optionally upload binary assets. Usage: mise run cliff:release -- vX.Y.Z [assets...]"
run = '''
#!/usr/bin/env nu
def main [tag?: string, ...assets: string] {
  let t = ($tag | default "")
  # vX.Y.Z, with an optional fork-distinct suffix (e.g. v1.0.0-jb.1) so forks
  # don't collide with upstream's own tags.
  if not ($t =~ '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { print -e "✗ usage: mise run cliff:release -- vX.Y.Z[-suffix] [assets...]"; exit 1 }
  # Release from whatever branch is checked out (main for our own repos, the
  # overlay branch e.g. joeblew999 for forks) — just not a detached HEAD.
  let branch = (^git rev-parse --abbrev-ref HEAD | str trim)
  if ($branch == "HEAD") { print -e "✗ detached HEAD — checkout a branch first"; exit 1 }
  if (^git status --porcelain | str trim | is-not-empty) { print -e "✗ working tree dirty — commit your work first (build artifacts must be gitignored)"; exit 1 }
  if (^git tag -l $t | str trim | is-not-empty) { print -e $"✗ tag ($t) already exists"; exit 1 }

  # 1. regenerate the changelog with the new tag (unreleased commits become $t)
  ^git-cliff --tag $t -o CHANGELOG.md
  ^git add CHANGELOG.md
  ^git commit -m $"chore\(release\): ($t)"

  # 2. tag + push branch and tag together
  ^git tag $t
  ^git push origin HEAD --tags

  # 3. GitHub release with this tag's notes
  let notes = (^git-cliff --tag $t --latest --strip all)
  $notes | ^gh release create $t --title $t --notes-file -

  # 4. optionally upload binary assets — and VERIFY they actually landed, so a
  #    release can never report success with no binaries attached.
  if ($assets | is-not-empty) {
    ^gh release upload $t ...$assets --clobber
    let want = ($assets | length)
    let got = (^gh release view $t --json assets | from json | get assets | length)
    if ($got < $want) { print -e $"✗ asset upload incomplete: ($got)/($want) attached to ($t)"; exit 1 }
    print $"✓ uploaded + verified ($got) asset\(s\)"
  }
  print $"✓ released ($t): changelog + tag + GitHub release"
}
'''

# ── cliff:unreleased ─────────────────────────────────────────────────────────
["cliff:unreleased"]
description = "This repo: changelog for commits since the last tag (what the next release would contain)."
run = '''
#!/usr/bin/env nu
def main [] { ^git-cliff --unreleased --strip all }
'''

# ── cliff:show ───────────────────────────────────────────────────────────────
["cliff:show"]
description = "This repo: the full changelog across all tags (stdout)."
run = '''
#!/usr/bin/env nu
def main [] { ^git-cliff --strip all }
'''

# ── cliff:repo ───────────────────────────────────────────────────────────────
["cliff:repo"]
description = "Any repo: clone owner/repo and show its UNreleased delta (or a TAG..HEAD range). Usage: mise run cliff:repo -- psviderski/uncloud [v0.19.0]"
run = '''
#!/usr/bin/env nu
def main [repo: string, from?: string] {
  let dir = (^mktemp -d | str trim)
  ^git clone --quiet $"https://github.com/($repo).git" $dir
  # Default base = latest SEMVER tag (ignores rolling tags like `nightly`, which
  # otherwise sit at HEAD and make --unreleased empty). Empty = no tags → full.
  let base = (if ($from | default "" | is-empty) {
    (^git -C $dir tag --list "v*.*.*" --sort=-version:refname | lines
      | where ($it | str trim | is-not-empty) | get 0? | default "")
  } else { $from })
  let out = (if ($base | is-empty) {
    ^git-cliff --repository $dir --strip all | complete
  } else {
    ^git-cliff --repository $dir --strip all $"($base)..HEAD" | complete
  })
  ^rm -rf $dir
  print ($out.stdout | str trim)
}
'''
