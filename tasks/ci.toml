# tasks/ci.toml — TOML-task definitions for the ci:* namespace: STATIC GUARDS.
# role: verify code — parse + global-config guards + dogfood
#
# ci:* = checks on THIS repo's own code/config (parse, global toolset, ref drift).
# It is the CI floor every consumer inherits. GitHub-Actions RUN management
# (watch/clean) lives in gh.toml — different tool, kept out of here.
#
# Tasks:
#   ci                 umbrella → ci:check-global + ci:check-nu (extend via a local ci)
#   ci:check-nu        parse-check every nu source (toml run bodies, workflow nu, mise-tasks/)
#   ci:check-global    canonical global toolset present; no rust/RUSTUP_TOOLCHAIN anywhere
#   ci:audit-lib-refs  audit/--write stale ?ref=/@ref pins to joeblew999/.github
#
# Tools come from the global mise config (no per-task pins) — see AGENTS.md.
# Validated cross-OS by .github dogfooding (.github/workflows/mise.yml) + the
# .github-example consumer.
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=<tag>",
#   ]

# ── ci ───────────────────────────────────────────────────────────────────────
# The default CI umbrella; the bootstrapped workflow stub runs `mise run ci`.
# Every repo that includes ci.toml gets working CI with zero repo code. Extend it
# by defining a LOCAL `ci` with extra `depends` (build/test) — mise MERGES them,
# so the guards still run and you don't re-list them.
["ci"]
description = "Default CI umbrella — runs the shared guards. Repos extend it with their own build/test."
depends = ["ci:check-global", "ci:check-nu", "ci:check-mise"]

# ── ci:check-mise ────────────────────────────────────────────────────────────
# The whole system promises `mise run ci` is identical locally and in CI. That
# breaks silently when your local mise differs from the version CI installs: the
# task-graph merge + parallelism behaviour changed between mise releases, so a dev
# on a newer mise can see a green `mise run ci` locally that runs FEWER tasks than
# CI, then push red. This guard surfaces the mismatch (warn only — never fails, so
# it can't itself break CI). CANONICAL must stay in sync with the `mise-version`
# default in reusable-mise-ci.yml / reusable-mise-release.yml.
["ci:check-mise"]
description = "Warn when the local mise version differs from the one CI pins (local-green ≠ CI-green otherwise)."
run = '''
#!/usr/bin/env nu
def main [] {
  let canonical = "2026.5.1"
  let running = (^mise --version | str trim | split row " " | first)
  if $running == $canonical {
    print $"✓ ci:check-mise — mise ($running) matches CI"
  } else {
    print --stderr $"⚠  ci:check-mise — local mise ($running) != CI-pinned ($canonical)."
    print --stderr $"   `mise run ci` may run a different task graph here than in CI."
    print --stderr $"   Align with:  mise use -g mise@($canonical)"
  }
}
'''

# ── ci:check-nu ──────────────────────────────────────────────────────────────
# Parse-check every nushell source in the repo via `nu --ide-check` — catches nu
# syntax errors before they fail at runtime (60-90s/iter in CI). Replaces the old
# ci:check-toml-tasks + ci:check-workflow-nu + ci:parse-check (one loop, DRY).
# Three sources, each optional (skipped if absent):
#   1. run bodies in root mise.toml + tasks/*.toml   (covers inline [tasks.x] too)
#   2. nu steps embedded in .github/workflows/*.yml
#   3. standalone nu files in mise-tasks/
["ci:check-nu"]
description = "Parse-check every nu source (mise.toml + tasks/*.toml run bodies, workflow nu steps, mise-tasks/*.nu) via `nu --ide-check`"
run = '''
#!/usr/bin/env nu

def main [] {
  let root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  cd $root
  let work = ($env.RUNNER_TEMP? | default "/tmp" | path join "ci-check-nu")
  if ($work | path exists) { rm -rf $work }
  mkdir $work

  # Triple-quote markers built from char codes so this body (itself wrapped in a
  # TOML triple-single block) can't close the outer quotes.
  let q3s = (['\u{27}', '\u{27}', '\u{27}'] | str join)
  let q3d = (['\u{22}', '\u{22}', '\u{22}'] | str join)
  # Match any table header [..] (covers ["ns:name"] AND [tasks.x]) then a run body.
  let pat_s = ("(?s)\\[([^\\]]+)\\][^\\[]*?run\\s*=\\s*" + $q3s + "(.*?)" + $q3s)
  let pat_d = ("(?s)\\[([^\\]]+)\\][^\\[]*?run\\s*=\\s*" + $q3d + "(.*?)" + $q3d)

  mut targets = []
  mut idx = 0

  # 1. TOML run bodies: root mise.toml + tasks/*.toml
  let toml_files = (
    ["mise.toml"]
    | append (glob ($"($root)/tasks/*.toml" | str replace --all "\\" "/"))
    | where {|f| ($f | path exists) }
    | uniq
  )
  for t in $toml_files {
    let raw = (open --raw $t)
    let bodies = (
      ($raw | parse --regex $pat_s | rename header body)
      | append ($raw | parse --regex $pat_d | rename header body)
    )
    for b in $bodies {
      $idx = $idx + 1
      let tmp = ($work | path join $"toml-($idx).nu")
      $b.body | save --force $tmp
      $targets = ($targets | append {label: $"($t | path basename) ($b.header)", file: $tmp})
    }
  }

  # 2. nu blocks embedded in .github/workflows/*.yml
  let wf_dir = ($root | path join ".github" "workflows")
  if ($wf_dir | path exists) {
    for f in (glob ($"($wf_dir)/*.yml" | str replace --all "\\" "/")) {
      let yaml = (try { open $f } catch { null })
      if ($yaml == null) { continue }
      if (not ($yaml | columns | "jobs" in $in)) { continue }
      for job_name in ($yaml.jobs | columns) {
        let steps = (($yaml.jobs | get $job_name).steps? | default [])
        mut si = 0
        for step in $steps {
          $si = $si + 1
          if not (($step.shell? | default "") | str contains "nu") { continue }
          let body = ($step.run? | default "")
          if ($body | is-empty) { continue }
          $idx = $idx + 1
          let tmp = ($work | path join $"wf-($idx).nu")
          $body | save --force $tmp
          $targets = ($targets | append {label: $"($f | path basename) ($job_name) step ($si)", file: $tmp})
        }
      }
    }
  }

  # 3. standalone nu files in mise-tasks/
  let mt = ($root | path join "mise-tasks")
  if ($mt | path exists) {
    let files = (
      glob ($"($mt)/**/*" | str replace --all "\\" "/")
      | where {|p| ($p | path type) == "file" }
      | where {|p| (try { open --raw $p | lines | first } catch { "" }) == "#!/usr/bin/env nu" }
    )
    for f in $files { $targets = ($targets | append {label: $"mise-tasks/($f | path basename)", file: $f}) }
  }

  if ($targets | is-empty) {
    print "(no nu sources found — nothing to check)"
    return
  }

  mut failed = []
  for t in $targets {
    let r = (do { ^nu --ide-check 1 $t.file } | complete)
    let errs = (
      $r.stdout | lines
      | where {|l| ($l | str contains '"type":"diagnostic"') and ($l | str contains '"severity":"Error"') }
    )
    if ($errs | length) > 0 { $failed = ($failed | append {label: $t.label, error: ($errs | first)}) }
  }

  print $"→ parse-checked ($targets | length) nu sources"
  if ($failed | length) > 0 {
    print --stderr $"✗ ($failed | length) with parse errors:"
    for f in $failed { print --stderr $"  - ($f.label): ($f.error)" }
    exit 1
  }
  print "✓ all nu sources parse-clean"
}
'''

# ── ci:audit-lib-refs ────────────────────────────────────────────────────────
# Drift audit + bump for every joeblew999/.github pin: the `?ref=vX` in
# mise.toml includes AND the `uses: …@vX` in .github/workflows/*. Compares
# each to the latest published tag.
#   (no flag) : report stale pins, exit 1   → CI gate / local sanity
#   --write   : rewrite stale pins to latest → the upgrade flow (reusable-mise-upgrade)
# Rolling pins (?ref=main / @main) never match the version regex, so they're
# left untouched. `mise outdated` only sees pinned TOOLS, not these git refs —
# this fills the gap so ONE upgrade PR bumps tools + lib refs together.
#
# Tools: gh (GitHub API for tags; needs GH_TOKEN in CI). nu from global config.
["ci:audit-lib-refs"]
description = "Audit (or --write) ?ref=/@ref drift across mise.toml + workflows that pin joeblew999/.github"
run = '''
#!/usr/bin/env nu

def main [
  --owner: string = "joeblew999"
  --repo: string = ".github"
  --write            # rewrite stale pins to latest instead of just reporting
] {
  let tags_raw = (^gh api $"repos/($owner)/($repo)/tags?per_page=10" | from json)
  if ($tags_raw | length) == 0 {
    print --stderr $"✗ no tags on ($owner)/($repo)"
    exit 1
  }
  let latest = ($tags_raw | first | get name)
  print $"Latest tag on ($owner)/($repo): ($latest)"
  print ""

  let lib = $"($owner)/($repo)"
  let lib_esc = ($lib | str replace --all '.' '\.')
  let uses_find = $lib_esc + '/[^@\s]+@(v[0-9]+\.[0-9]+\.[0-9]+)'
  let uses_sub  = '(' + $lib_esc + '/[^@\s]+@)v[0-9]+\.[0-9]+\.[0-9]+'
  let ref_find  = '\?ref=(v[0-9]+\.[0-9]+\.[0-9]+)'
  let ref_sub   = '(\?ref=)v[0-9]+\.[0-9]+\.[0-9]+'

  # This repo's own pins: root mise.toml + workflow stubs.
  let root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  # Forward-slash the glob patterns — Windows path join → backslashes that glob rejects.
  let own = (
    [($root | path join "mise.toml")]
    | append (glob ($"($root)/.github/workflows/*.yml" | str replace --all "\\" "/"))
    | append (glob ($"($root)/.github/workflows/*.yaml" | str replace --all "\\" "/"))
  )
  # AUDIT scans every tracked mise.toml on the box (read-only cross-repo sanity).
  # --WRITE touches ONLY this repo — never rewrites other repos on your machine.
  let files = (
    if $write { $own } else {
      (^mise config ls --tracked-configs
        | lines | each { |l| $l | str trim } | where { |l| not ($l | is-empty) })
      | append $own
    }
    | uniq
    | where { |f| ($f | path exists) }
  )

  mut findings = []
  for f in $files {
    let raw = (try { open --raw $f } catch { "" })
    if not ($raw | str contains $lib) { continue }
    let pins = (
      ($raw | parse --regex $ref_find  | get -o capture0 | default [])
      | append ($raw | parse --regex $uses_find | get -o capture0 | default [])
      | uniq
    )
    for p in ($pins | where { |p| $p != $latest }) {
      $findings = ($findings | append {file: $f, current: $p, latest: $latest})
    }
  }

  if ($findings | length) == 0 {
    print $"✓ all pins at ($latest)"
    return
  }

  if not $write {
    print $"⚠ ($findings | length) stale pin\(s\):"
    print ""
    $findings | print
    print ""
    print "Run `mise run ci:audit-lib-refs --write` to bump them."
    exit 1
  }

  for f in ($findings | get file | uniq) {
    let before = (open --raw $f)
    let after = (
      $before
      | str replace --all --regex $ref_sub  $"${1}($latest)"
      | str replace --all --regex $uses_sub $"${1}($latest)"
    )
    if $before != $after {
      $after | save --force $f
      print $"✓ ($f) → ($latest)"
    }
  }
}
'''

# ── ci:check-global ──────────────────────────────────────────────────────────
# Guard the mise configuration. Two invariants:
#   1. The canonical common toolset is present in the global config.
#   2. NEITHER the global config NOR any repo config manages Rust — i.e. no
#      `rust = …` and no `RUSTUP_TOOLCHAIN = …`. mise selects a Rust toolchain
#      by exporting RUSTUP_TOOLCHAIN, which is the HIGHEST-precedence override
#      in rustup and silently defeats every repo's rust-toolchain.toml. Rust is
#      delegated to rustup + per-repo rust-toolchain.toml; mise must stay out.
# Run locally or in CI; exits non-zero (with a fix hint) on any violation.
["ci:check-global"]
description = "Guard mise config: canonical global toolset present, and no `rust`/RUSTUP_TOOLCHAIN in any mise config (rustup + rust-toolchain.toml own Rust). Fails on violation."
run = '''
#!/usr/bin/env nu

def main [
  --root: string = ""   # workspace root to scan for repo configs; defaults to $env.PWD
] {
  mut violations = []

  # ── 1. global config: canonical toolset present, no Rust management ──────────
  let global = ($nu.home-dir | path join ".config" "mise" "config.toml")
  if ($global | path exists) {
    let txt = (open --raw $global)
    if ($txt | lines | any {|l| $l =~ '^\s*rust\s*=' }) {
      $violations = ($violations | append $"($global): declares `rust` — remove it; rustup + rust-toolchain.toml own the Rust toolchain")
    }
    if ($txt | lines | any {|l| $l =~ '^\s*RUSTUP_TOOLCHAIN\s*=' }) {
      $violations = ($violations | append $"($global): sets RUSTUP_TOOLCHAIN — remove it; it overrides every repo's rust-toolchain.toml")
    }
    for t in ["fnox" "gh" "jq" "usage" "git-cliff" "nushell"] {
      if not ($txt | str contains $t) {
        $violations = ($violations | append $"($global): missing canonical tool `($t)` — run `mise run mise:global:bootstrap`")
      }
    }
  } else {
    $violations = ($violations | append $"($global): not found — run `mise run mise:global:bootstrap`")
  }

  # ── 2. no repo config may manage Rust either ────────────────────────────────
  let root = (if ($root | is-empty) { $env.PWD } else { $root })
  # Cross-platform glob: cd into root + a RELATIVE forward-slash pattern (never
  # interpolate an OS path into a glob — Windows backslashes break the parser),
  # and filter by path COMPONENTS via `path split` (no separator assumptions).
  cd $root
  let cfgs = (
    glob "**/{mise,.mise}.toml"
    | where {|p| let parts = ($p | path split); ("target" not-in $parts) and (".git" not-in $parts) }
  )
  for c in $cfgs {
    let txt = (open --raw $c)
    if ($txt | lines | any {|l| $l =~ '^\s*rust\s*=' }) {
      $violations = ($violations | append $"($c): declares `rust` — remove it; pin via rust-toolchain.toml instead")
    }
    if ($txt | lines | any {|l| $l =~ '^\s*RUSTUP_TOOLCHAIN\s*=' }) {
      $violations = ($violations | append $"($c): sets RUSTUP_TOOLCHAIN — remove it; pin via rust-toolchain.toml instead")
    }
  }

  if ($violations | is-empty) {
    print "✓ ci:check-global — canonical global toolset present, no Rust override in any mise config"
    return
  }
  print -e "✗ ci:check-global found violations:"
  for v in $violations { print -e $"  • ($v)" }
  exit 1
}
'''
