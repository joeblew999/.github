# tasks/ci.toml — TOML-task definitions for the ci:* namespace.
#
# Each task declares its own `tools = { ... }` — those tools auto-install
# when the task runs and don't leak into the consumer's root context.
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/ci.toml?ref=v0.16.0",
#   ]
#
# No experimental flag, no vendoring, no env-var setup needed. Validated by
# .github/workflows/tasks-toml-proof.yml on linux+macos+windows.
#
# Tool pin policy: track the same versions as joeblew999/.github's own
# mise.toml [tools] block. Bump them together when the lib version is bumped.

# ── ci:_base ──
# Hidden base task — every ci:* extends this for shared nu pin.
["ci:_base"]
hide = true
tools = { "github:nushell/nushell" = "0.112" }

# ── ci:check-toml-tasks ──────────────────────────────────────────────────────
# Parse-check every inline `run = '''...'''` body in tasks/*.toml of the
# current repo. Spawns `nu --ide-check 1` on each extracted body — same
# parser nu's LSP uses — and reports any severity:Error diagnostics.
#
# Catches nu syntax errors in TOML-task bodies that would otherwise only
# surface at runtime when the task is invoked. Sister task to
# ci:parse-check (which scans standalone .nu files in mise-tasks/).
#
# Use as a local pre-push lint AND in CI. Self-hosted: this very task
# parse-checks itself when run against joeblew999/.github's own tasks/.
["ci:check-toml-tasks"]
extends = "ci:_base"
description = "Parse-check every inline `run = '''...'''` body in tasks/*.toml via `nu --ide-check`"

run = '''
#!/usr/bin/env nu

def main [
  --dir (-d): string = "tasks"   # directory containing tasks/*.toml
] {
  let project_root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  cd $project_root

  # Handle both absolute and relative --dir; absolute → use verbatim,
  # relative → prepend project_root.
  let scan_dir = (if ($dir | str starts-with "/") { $dir } else { $"($project_root)/($dir)" })

  if not ($scan_dir | path exists) {
    print $"\(no ($scan_dir)/ — nothing to check\)"
    return
  }

  # Forward-slash glob — path join uses backslash on Windows which the
  # glob parser rejects.
  let glob_pat = ($"($scan_dir)/*.toml" | str replace --all "\\" "/")
  let tomls = (glob $glob_pat)

  if ($tomls | length) == 0 {
    print $"\(no *.toml files under ($scan_dir)/ — nothing to check\)"
    return
  }

  let work = ($env.RUNNER_TEMP? | default "/tmp" | path join "ci-check-toml-tasks")
  if ($work | path exists) { rm -rf $work }
  mkdir $work

  # Patterns: handle BOTH triple-single AND triple-double quoted run bodies.
  # TOML allows both forms; previously only single-quote (TQS) was matched.
  # Triple-quote markers built from char codes (\u{27}=apostrophe,
  # \u{22}=quote) so this script's own body can be wrapped in a TOML
  # triple-quoted block without the inner triples closing the outer.
  let q3s = (['\u{27}', '\u{27}', '\u{27}'] | str join)
  let q3d = (['\u{22}', '\u{22}', '\u{22}'] | str join)
  let pat_single = ("(?s)\\[\"([^\"]+)\"\\][^\\[]*?run\\s*=\\s*" + $q3s + "(.*?)" + $q3s)
  let pat_double = ("(?s)\\[\"([^\"]+)\"\\][^\\[]*?run\\s*=\\s*" + $q3d + "(.*?)" + $q3d)

  mut total = 0
  mut failed = []

  for t in $tomls {
    let raw = (open --raw $t)
    let bodies = (
      ($raw | parse --regex $pat_single | rename task body)
      | append ($raw | parse --regex $pat_double | rename task body)
    )
    for entry in $bodies {
      $total = $total + 1
      let safe = ($entry.task | str replace --all ":" "_")
      let tmp = ($work | path join $"($safe).nu")
      $entry.body | save --force $tmp
      let r = (do { ^nu --ide-check 1 $tmp } | complete)
      # Strict diagnostic match: require BOTH `"type":"diagnostic"` AND
      # `"severity":"Error"` on the same line (not just a stray "Error"
      # appearing somewhere in stdout).
      let err_lines = (
        $r.stdout
        | lines
        | where { |l| ($l | str contains "\"type\":\"diagnostic\"") and ($l | str contains "\"severity\":\"Error\"") }
      )
      if ($err_lines | length) > 0 {
        let first_diag = ($err_lines | first | default "")
        $failed = ($failed | append {task: $entry.task, error: $first_diag})
      }
    }
  }

  let toml_count = ($tomls | length)
  print $"→ parse-checked ($total) inline run bodies across ($toml_count) tasks/*.toml files"
  if ($failed | length) > 0 {
    let fail_count = ($failed | length)
    print --stderr ""
    print --stderr $"✗ ($fail_count) task\(s\) with parse errors:"
    for f in $failed {
      print --stderr $"  - ($f.task): ($f.error)"
    }
    exit 1
  }
  print "✓ all inline run bodies parse-clean"
}
'''

# ── ci:audit-lib-refs ────────────────────────────────────────────────────────
# Cross-repo drift audit: scan every mise.toml on this machine that
# references joeblew999/.github via git:: URL, compare each ?ref=v...
# pin to the latest published tag, report anything stale.
#
# `mise outdated` only sees pinned TOOLS, not git URLs, so this fills
# the gap. Run before bumping or as a periodic sanity check.
#
# Tools: gh (GitHub API for tags). Inherits nu from ci:_base.
["ci:audit-lib-refs"]
extends = "ci:_base"
description = "Audit ?ref= drift across every tracked mise.toml that includes joeblew999/.github"
tools = { "aqua:cli/cli" = "2" }
run = '''
#!/usr/bin/env nu

def main [
  --owner: string = "joeblew999"
  --repo: string = ".github"
] {
  let tags_raw = (^gh api $"repos/($owner)/($repo)/tags?per_page=10" | from json)
  if ($tags_raw | length) == 0 {
    print --stderr $"✗ no tags on ($owner)/($repo)"
    exit 1
  }
  let latest = ($tags_raw | first | get name)
  print $"Latest tag on ($owner)/($repo): ($latest)"
  print ""

  let tracked = (^mise config ls --tracked-configs | lines | each { |l| $l | str trim } | where { |l| not ($l | is-empty) })

  let lib_url = $"github.com/($owner)/($repo)"
  mut findings = []

  for cfg in $tracked {
    if not ($cfg | path exists) { continue }
    let raw = (try { open --raw $cfg } catch { "" })
    if not ($raw | str contains $lib_url) { continue }
    let refs = (
      $raw
      | parse --regex '\?ref=(v[0-9]+\.[0-9]+\.[0-9]+)'
      | get capture0
      | uniq
    )
    if ($refs | length) == 0 { continue }
    for r in $refs {
      if $r != $latest {
        $findings = ($findings | append {config: $cfg, current: $r, latest: $latest})
      }
    }
  }

  if ($findings | length) == 0 {
    print $"✓ all tracked configs at ($latest)"
    return
  }

  let count = ($findings | length)
  print $"⚠ ($count) stale ?ref= pin\(s\):"
  print ""
  $findings | print
  print ""
  print "To bump: edit each mise.toml's includes URLs."
  exit 1
}
'''

# ── ci:check-workflow-nu ─────────────────────────────────────────────────────
# Parse-check every embedded nu block in .github/workflows/*.yml. Walks the
# parsed YAML structure (jobs.<job>.steps[]) and finds every step whose
# `shell:` mentions nu, extracts the `run:` body, and runs it through
# `nu --ide-check 1`.
#
# Catches the class of bugs where a workflow YAML edits an inline nu
# block and ships it without ever running nu against it locally — leading
# to a CI failure that takes 60-90s per iteration to feedback.
["ci:check-workflow-nu"]
extends = "ci:_base"
description = "Parse-check every embedded nu block in .github/workflows/*.yml via `nu --ide-check`"

run = '''
#!/usr/bin/env nu

def main [
  --dir (-d): string = ".github/workflows"
] {
  let project_root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  cd $project_root

  # Handle both absolute and relative --dir.
  let scan_dir = (if ($dir | str starts-with "/") { $dir } else { $"($project_root)/($dir)" })

  if not ($scan_dir | path exists) {
    print $"\(no ($scan_dir)/ — nothing to check\)"
    return
  }

  let glob_pat = ($"($scan_dir)/*.yml" | str replace --all "\\" "/")
  let yml_files = (glob $glob_pat)

  if ($yml_files | length) == 0 {
    print $"\(no *.yml files under ($scan_dir)/ — nothing to check\)"
    return
  }

  let work = ($env.RUNNER_TEMP? | default "/tmp" | path join "ci-check-workflow-nu")
  if ($work | path exists) { rm -rf $work }
  mkdir $work

  mut total = 0
  mut failed = []

  for f in $yml_files {
    let yaml = (try { open $f } catch { null })
    if ($yaml == null) { continue }
    if (not ($yaml | columns | "jobs" in $in)) { continue }

    let jobs = $yaml.jobs
    let job_names = ($jobs | columns)
    for job_name in $job_names {
      let job = ($jobs | get $job_name)
      let steps = ($job.steps? | default [])
      mut step_idx = 0
      for step in $steps {
        $step_idx = $step_idx + 1
        let shell_str = ($step.shell? | default "")
        # Only check steps whose `shell:` mentions nu.
        if not ($shell_str | str contains "nu") { continue }
        let body = ($step.run? | default "")
        if ($body | is-empty) { continue }

        $total = $total + 1
        let yml_basename = ($f | path basename | str replace ".yml" "")
        let safe = ($"($yml_basename)-($job_name)-($step_idx)" | str replace --all ":" "_")
        let tmp = ($work | path join $"($safe).nu")
        $body | save --force $tmp
        let r = (do { ^nu --ide-check 1 $tmp } | complete)
        if ($r.stdout | str contains "severity\":\"Error") {
          let first_diag = ($r.stdout | lines | first | default "")
          $failed = ($failed | append {
            file: ($f | path basename),
            job: $job_name,
            step: $step_idx,
            step_name: ($step.name? | default "—"),
            error: $first_diag,
          })
        }
      }
    }
  }

  let yml_count = ($yml_files | length)
  print $"→ parse-checked ($total) embedded nu blocks across ($yml_count) workflow files"
  if ($failed | length) > 0 {
    let fail_count = ($failed | length)
    print --stderr ""
    print --stderr $"✗ ($fail_count) block\(s\) with parse errors:"
    for f in $failed {
      print --stderr $"  - ($f.file) :: ($f.job) :: step ($f.step) \(($f.step_name)\)"
      print --stderr $"      ($f.error)"
    }
    exit 1
  }
  print "✓ all embedded nu blocks parse-clean"
}
'''

# ── ci:parse-check ───────────────────────────────────────────────────────────
# Generic parse-checker for nu task files. Globs the consumer's mise-tasks/
# (recursive), filters to files whose first line is the nu shebang, runs
# `nu --ide-check 1` on each. Used by every consumer's local `check` bundle
# as the cheap first-line-of-defense lint.
["ci:parse-check"]
extends = "ci:_base"
description = "Parse-check every nu task file in mise-tasks/ (fails if any has a syntax error)"

run = '''
#!/usr/bin/env nu

def main [
  --dir (-d): string = "mise-tasks"   # directory to scan; default: mise-tasks
] {
  let project_root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  cd $project_root

  if not ($dir | path exists) {
    print $"\(no ($dir)/ in this repo — nothing to check)"
    return
  }

  let files = (
    glob $"($dir)/**/*"
    | where { |p| ($p | path type) == "file" }
    | where { |p|
        let first = (try { open --raw $p | lines | first } catch { "" })
        $first == "#!/usr/bin/env nu"
      }
  )

  if ($files | length) == 0 {
    print $"\(no nu task files found under ($dir)/)"
    return
  }

  mut errors = []
  for f in $files {
    let result = (do { ^nu --ide-check 1 $f } | complete)
    if ($result.stdout | str contains 'severity":"Error"') {
      $errors = ($errors | append $f)
      print --stderr $"✗ ($f | path basename)"
      print --stderr ($result.stdout | lines | where { |l| ($l | str contains 'severity":"Error"') } | first)
    }
  }
  if ($errors | length) > 0 {
    print --stderr $"\n✗ ($errors | length) file\(s\) with parse errors"
    exit 1
  }
  print $"✓ ($files | length) nu task files parse-clean"
}
'''

# ── ci:watch ─────────────────────────────────────────────────────────────────
# Polls GitHub Actions for the latest run on this branch, prints transitions
# only, dumps failed-step logs as soon as a job completes (works mid-run).
# REPO is auto-derived from `git remote get-url origin`; works in any repo.
# Token from GH_TOKEN/GITHUB_TOKEN env or `fnox get GITHUB_TOKEN`.
["ci:watch"]
extends = "ci:_base"
description = "Watch the latest CI run on this branch — streams per-job + per-step transitions, dumps failed-step logs via gh api"
tools = { "github:jdx/fnox" = "1.24", "aqua:cli/cli" = "2" }
run = '''
#!/usr/bin/env nu

def gh-token [] {
  let env_tok = ($env.GH_TOKEN? | default ($env.GITHUB_TOKEN? | default ""))
  if ($env_tok | is-not-empty) { return $env_tok }
  try { ^fnox get GITHUB_TOKEN | str trim } catch { "" }
}

def origin-repo [] {
  let url = (try { ^git remote get-url origin | str trim } catch { "" })
  let parsed = ($url | parse --regex '.*[:/](?<owner>[^/]+)/(?<name>[^/]+?)(?:\.git)?$')
  if ($parsed | length) == 0 { return "" }
  let row = ($parsed | first)
  $"($row.owner)/($row.name)"
}

def gh-run-view-retry [id: int, repo: string, token: string] {
  mut attempts = 0
  loop {
    let r = (with-env {GH_TOKEN: $token} { do { ^gh run view $id --repo $repo --json status,conclusion,jobs } | complete })
    if $r.exit_code == 0 { return ($r.stdout | from json) }
    $attempts = $attempts + 1
    if $attempts >= 5 {
      print --stderr $"✗ gh api failed after 5 attempts: ($r.stderr | default '?' | str trim)"
      exit 1
    }
    print $"  · gh api blip \(attempt ($attempts)/5\), retrying in 10s..."
    sleep 10sec
  }
}

def status-mark [status: string, conclusion: string] {
  if $conclusion == "success" { "✓" }
  else if $conclusion == "failure" { "✗" }
  else if $conclusion == "cancelled" { "⊘" }
  else if $conclusion == "skipped" { "·" }
  else if $status == "in_progress" { "▶" }
  else { "·" }
}

def job-duration [j: any, now: datetime] {
  let started = ($j.startedAt? | default "")
  if ($started | is-empty) { return "—" }
  let s = ($started | into datetime)
  let end = if ($j.status == "completed") {
    ($j.completedAt? | default "" | into datetime)
  } else { $now }
  ($end - $s) | format duration sec
}

def step-duration [s: any, now: datetime] {
  let started = ($s.startedAt? | default "")
  if ($started | is-empty) { return "—" }
  let st = ($started | into datetime)
  let end = if ($s.status == "completed") {
    ($s.completedAt? | default "" | into datetime)
  } else { $now }
  ($end - $st) | format duration sec
}

def main [
  --run-id (-r): int          # specific run id (default: latest on --branch)
  --branch (-b): string       # default: current branch from `git branch --show-current`
  --workflow (-w): string = "mise.yml"
  --interval (-i): int = 20    # seconds between polls
] {
  let token = (gh-token)
  if ($token | is-empty) {
    print --stderr "✗ no GitHub token: set GH_TOKEN, GITHUB_TOKEN, or fnox set GITHUB_TOKEN"
    exit 1
  }

  let repo = (origin-repo)
  if ($repo | is-empty) {
    print --stderr "✗ couldn't parse repo from `git remote get-url origin`"
    exit 1
  }

  let br = if $branch != null {
    $branch
  } else {
    try { ^git branch --show-current | str trim } catch { "main" }
  }

  let id = if $run_id != null {
    $run_id
  } else {
    let latest = (with-env {GH_TOKEN: $token} { ^gh run list --workflow $workflow --branch $br --limit 1 --repo $repo --json databaseId } | from json)
    if ($latest | length) == 0 {
      print --stderr $"✗ no runs found for ($workflow) on ($br) in ($repo)"
      exit 1
    }
    ($latest | first | get databaseId)
  }

  let started = (date now)
  print $"watching run ($id) on ($repo)  \(started ($started | format date '%H:%M:%S')\)"
  mut seen = {}
  mut failed_jobs = []

  loop {
    let detail = (gh-run-view-retry $id $repo $token)
    let run_status = $detail.status
    let run_conclusion = ($detail.conclusion | default "")
    let now = (date now)

    for j in $detail.jobs {
      let job_id = ($j.databaseId | into string)
      let job_cur = $"($j.status):($j.conclusion | default '')"
      let job_prev = ($seen | get --optional $job_id | default "")
      if $job_cur != $job_prev {
        let mark = (status-mark $j.status ($j.conclusion | default ""))
        let dur = (job-duration $j $now)
        print $"  ($mark) ($j.name | fill -w 30 -a l) ($job_cur | fill -w 22 -a l) ($dur)"
        $seen = ($seen | upsert $job_id $job_cur)
        if $j.conclusion == "failure" and not ($job_id in $failed_jobs) {
          $failed_jobs = ($failed_jobs | append $job_id)
        }
      }

      for s in ($j.steps | default []) {
        let key = $"($job_id):($s.number)"
        let s_cur = $"($s.status):($s.conclusion | default '')"
        let s_prev = ($seen | get --optional $key | default "")
        if $s_cur != $s_prev {
          let is_failure = ($s.conclusion == "failure")
          let is_meaningful = (not (($s.name | str starts-with "Set up") or ($s.name | str starts-with "Post ") or ($s.name | str starts-with "Complete job") or ($s.name == "Pre run") or ($s.name == "Run actions/checkout@v5")))
          if $is_failure or ($is_meaningful and ($s.conclusion != null and $s.conclusion != "")) {
            let mark = (status-mark $s.status ($s.conclusion | default ""))
            let dur = (step-duration $s $now)
            print $"      ($mark) ($s.name | fill -w 36 -a l) ($s_cur | fill -w 22 -a l) ($dur)  [($j.name)]"
          }
          $seen = ($seen | upsert $key $s_cur)
        }
      }
    }

    if $run_status == "completed" {
      let total = (((date now) - $started) | format duration sec)
      print ""
      print $"run ($id) → ($run_conclusion)  \(watcher ran ($total)\)"
      break
    }

    let in_prog = ($detail.jobs | where { |j| $j.status == "in_progress" })
    if ($in_prog | length) > 0 {
      let elapsed = ((($now - $started) | format duration sec))
      let summary = ($in_prog | each { |j| $"($j.name) [(job-duration $j $now)]" } | str join "  ")
      print $"  · \(elapsed ($elapsed)\) running: ($summary)"
    }

    sleep ($interval * 1sec)
  }

  if ($failed_jobs | length) > 0 {
    print ""
    print "=== failed-job logs ==="
    for jid in $failed_jobs {
      print ""
      print $"--- job ($jid) ---"
      let log = (with-env {GH_TOKEN: $token} { do { ^gh api $"repos/($repo)/actions/jobs/($jid)/logs" } | complete })
      let body = ($log.stdout | default "")
      let lines = ($body | lines)
      let markers = [
        "task failed"
        "Error: nu::"
        "TypeError"
        "AssertionError"
        "##[error]"
        "FAIL "
        "error TS"
        "error: "
        "ERROR ["
      ]
      let hits = (
        $lines
        | enumerate
        | where { |row| $markers | any { |m| ($row.item | str contains $m) } }
        | get index
      )
      if ($hits | length) > 0 {
        let printed = ($hits | each { |i|
          let lo = if $i > 5 { $i - 5 } else { 0 }
          let hi = if ($i + 3) < ($lines | length) { $i + 3 } else { ($lines | length) - 1 }
          $lines | range $lo..$hi | str join "\n"
        })
        print ($printed | str join "\n  ---\n")
      } else {
        print "(no clear error markers; tail 40)"
        print ($lines | last 40 | str join "\n")
      }
    }
    exit 1
  }
}
'''

# ── ci:clean ─────────────────────────────────────────────────────────────────
# Delete CI runs (default: failed/cancelled only; --all to nuke every run;
# --dry-run to preview). REPO from origin remote; token from env/fnox.
["ci:clean"]
extends = "ci:_base"
description = "Delete CI runs (default: failed/cancelled only; --all to nuke every run; --dry-run to preview)"
tools = { "github:jdx/fnox" = "1.24", "aqua:cli/cli" = "2" }
run = '''
#!/usr/bin/env nu

def gh-token [] {
  let env_tok = ($env.GH_TOKEN? | default ($env.GITHUB_TOKEN? | default ""))
  if ($env_tok | is-not-empty) { return $env_tok }
  try { ^fnox get GITHUB_TOKEN | str trim } catch { "" }
}

def origin-repo [] {
  let url = (try { ^git remote get-url origin | str trim } catch { "" })
  let parsed = ($url | parse --regex '.*[:/](?<owner>[^/]+)/(?<name>[^/]+?)(?:\.git)?$')
  if ($parsed | length) == 0 { return "" }
  let row = ($parsed | first)
  $"($row.owner)/($row.name)"
}

def main [
  --all                      # delete every run, including successes
  --branch (-b): string      # only this branch (default: any)
  --workflow (-w): string = "mise.yml"
  --limit (-l): int = 200    # max runs to consider per call
  --keep-latest              # keep the latest successful run per branch
  --dry-run                  # list candidates without deleting
] {
  let token = (gh-token)
  if ($token | is-empty) {
    print --stderr "✗ no GitHub token: set GH_TOKEN, GITHUB_TOKEN, or fnox set GITHUB_TOKEN"
    exit 1
  }
  let repo = (origin-repo)
  if ($repo | is-empty) {
    print --stderr "✗ couldn't parse repo from `git remote get-url origin`"
    exit 1
  }

  let base_args = ["run" "list" "--workflow" $workflow "--limit" ($limit | into string) "--repo" $repo "--json" "databaseId,conclusion,status,headBranch,createdAt"]
  let args = if $branch != null { $base_args | append ["--branch" $branch] } else { $base_args }
  let runs = (with-env {GH_TOKEN: $token} { ^gh ...$args } | from json)
  if ($runs | length) == 0 {
    print "no runs found"
    return
  }

  let candidates = if $all {
    if $keep_latest {
      let keepers = (
        $runs
        | where conclusion == "success"
        | sort-by createdAt -r
        | group-by headBranch
        | values
        | each { |g| $g | first | get databaseId }
      )
      $runs | where { |r| not ($r.databaseId in $keepers) }
    } else {
      $runs
    }
  } else {
    $runs | where { |r| $r.conclusion == "failure" or $r.conclusion == "cancelled" or $r.status != "completed" }
  }

  if ($candidates | length) == 0 {
    print "✓ nothing to delete"
    return
  }

  print $"target: ($workflow) on ($repo)"
  print $"found ($candidates | length) run\(s\) to delete:"
  for r in $candidates {
    print $"  ($r.databaseId)  ($r.headBranch)  ($r.status):($r.conclusion | default '')"
  }

  if $dry_run {
    print ""
    print "(dry-run — no deletes)"
    return
  }

  print ""
  for r in $candidates {
    let res = (with-env {GH_TOKEN: $token} { do { ^gh run delete ($r.databaseId | into string) --repo $repo } | complete })
    if $res.exit_code == 0 {
      print $"✓ deleted ($r.databaseId)"
    } else {
      print --stderr $"✗ failed to delete ($r.databaseId): ($res.stderr | default $res.stdout)"
    }
  }
  print ""
  print $"done — deleted ($candidates | length) run\(s\)"
}
