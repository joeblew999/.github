# tasks/release.toml — shared binary-release PACKAGING for the joeblew999 fleet.
# role: ship — changelog → tag → GitHub release
#
# release:pack archives each immediate subdir of a staging dir into a tar.gz with
# the subdir's (goreleaser-style) name. The repo-specific BUILD that populates
# the staging dir stays in each repo — build models differ (Go cross-compiles
# all targets locally; Rust GUI builds per-OS in CI; Rust servers build per-arch
# in containers). Pair with cliff:release to publish:
#
#   mise run release:pack -- --dir target/dist
#   mise run cliff:release -- vX.Y.Z ...(ls target/dist/*.tar.gz | get name)
#
# Consumer wiring:
#   [task_config]
#   includes = [ "git::https://github.com/joeblew999/.github.git//tasks/release.toml?ref=<tag>" ]

["release:pack"]
description = "tar.gz each subdir of a staging dir (default: dist) into goreleaser-named archives. Usage: mise run release:pack [-- --dir target/dist]"
run = '''
#!/usr/bin/env nu
def main [
  --dir: string = "dist"   # staging dir whose immediate subdirs become archives
] {
  if not ($dir | path exists) {
    print --stderr $"✗ staging dir not found: ($dir) — run the repo's build first"
    exit 1
  }
  let subdirs = (ls $dir | where type == dir | get name)
  if ($subdirs | is-empty) {
    print --stderr $"✗ no subdirs to pack in ($dir)"
    exit 1
  }
  for d in $subdirs {
    let base = ($d | path basename)
    # FLAT archive (contents at the tar root, goreleaser-standard) — `-C <subdir> .`
    ^tar -czf ($dir | path join $"($base).tar.gz") -C ($dir | path join $base) .
    print $"  ✓ ($base).tar.gz"
  }
  # one archive per subdir — no glob needed (and `glob` chokes on Windows backslash paths).
  print $"✓ packed ($subdirs | length) archive\(s\) in ($dir)"
}
'''

# ── release:github ───────────────────────────────────────────────────────────
# Release driver — composes git-cliff + git + gh (this is WHY it lives in
# release:, not cliff:): regenerate CHANGELOG.md, commit, tag, push branch+tag,
# cut the GitHub release with the same notes, and optionally upload + verify
# binary assets (build them into a gitignored dir, then release:pack first).
# Any branch (main, or a fork's overlay); fork-distinct -suffix ok.
#   mise run release:github -- vX.Y.Z                 # changelog + tag + release
#   mise run release:github -- vX.Y.Z dist/*.tar.gz   # ...and upload binaries
["release:github"]
description = "Release driver: git-cliff changelog + tag + push, then publish via release:publish. IDEMPOTENT + self-recovering — if a prior run left a tag without a Release, re-running completes it. Usage: mise run release:github -- vX.Y.Z [assets...]"
run = '''
#!/usr/bin/env nu
def main [tag?: string, ...assets: string] {
  let t = ($tag | default "")
  # vX.Y.Z, with an optional fork-distinct suffix (e.g. v1.0.0-jb.1).
  if not ($t =~ '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { print -e "✗ usage: mise run release:github -- vX.Y.Z[-suffix] [assets...]"; exit 1 }

  # Target OUR repo explicitly so a fork releases to itself, not its parent.
  let repo = (^git remote get-url origin | str trim | str replace -r '.*github\.com[:/]' '' | str replace -r '\.git$' '')

  let tag_local  = (^git tag -l $t | str trim | is-not-empty)
  let tag_remote = (^git ls-remote --tags origin $t | str trim | is-not-empty)
  let tag_exists = ($tag_local or $tag_remote)
  let rel_exists = ((do { ^gh release view $t --repo $repo } | complete | get exit_code) == 0)

  if $rel_exists { print -e $"✗ ($t) is already released — bump the version"; exit 1 }

  if $tag_exists {
    # RECOVERY: tag exists but no Release (a prior run died after `git push --tags`,
    # before/at `gh release create`). Don't re-commit/re-tag — just finish publishing.
    print $"• tag ($t) exists without a Release — completing publish \(recovery)"
    if $tag_local and (not $tag_remote) { ^git push origin $t }
    ^mise run release:publish -- $t ...$assets
    print $"✓ recovered + released ($t)"
    return
  }

  # FRESH release — needs a branch + clean tree so the changelog commit is the only change.
  let branch = (^git rev-parse --abbrev-ref HEAD | str trim)
  if ($branch == "HEAD") { print -e "✗ detached HEAD — checkout a branch first"; exit 1 }
  if (^git status --porcelain | str trim | is-not-empty) { print -e "✗ working tree dirty — commit your work first (build artifacts must be gitignored)"; exit 1 }

  ^git-cliff --tag $t -o CHANGELOG.md
  ^git add CHANGELOG.md
  ^git commit -m $"chore\(release\): ($t)"
  ^git tag $t
  ^git push origin HEAD
  ^git push origin $t

  # Create the Release + upload assets via the idempotent publisher (retry-safe:
  # if THIS step hiccups, just re-run `release:github` — it recovers via the path above).
  ^mise run release:publish -- $t ...$assets
  print $"✓ released ($t): changelog + tag + GitHub release"
}
'''

# ── release:publish ────────────────────────────────────────────────────────────
# Publish a GitHub release for an ALREADY-EXISTING tag — the CI half of a
# multi-OS release. release:github (above) creates the tag LOCALLY for the host
# arch; this attaches assets to that tag from a workflow, where each OS in the
# matrix built its own arch (no cross-compile). Idempotent: creates the release
# if missing (matrix jobs may race), then uploads + verifies assets via --clobber.
#   mise run release:publish -- vX.Y.Z dist/*.tar.gz
# Used by reusable-mise-release.yml. Needs GH_TOKEN in env (the workflow sets it).
["release:publish"]
description = "Publish a GitHub release for an EXISTING tag: git-cliff notes + create-if-missing + verified asset upload. Usage: mise run release:publish -- vX.Y.Z [assets...]"
run = '''
#!/usr/bin/env nu
def main [tag?: string, ...assets: string] {
  let t = ($tag | default "")
  if not ($t =~ '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$') { print -e "✗ usage: mise run release:publish -- vX.Y.Z[-suffix] [assets...]"; exit 1 }
  let repo = (^git remote get-url origin | str trim | str replace -r '.*github\.com[:/]' '' | str replace -r '\.git$' '')

  # Create the release if it doesn't exist yet (idempotent — safe to re-run).
  let exists = ((do { ^gh release view $t --repo $repo } | complete | get exit_code) == 0)
  if not $exists {
    let notes = (^git-cliff --tag $t --latest --strip all)
    $notes | ^gh release create $t --repo $repo --title $t --notes-file -
    print $"✓ created release ($t) on ($repo)"
  } else {
    print $"• release ($t) already exists on ($repo) — attaching assets"
  }

  if ($assets | is-not-empty) {
    ^gh release upload $t ...$assets --repo $repo --clobber
    let want = ($assets | length)
    let got = (^gh release view $t --repo $repo --json assets | from json | get assets | length)
    if ($got < $want) { print -e $"✗ asset upload incomplete: ($got)/($want) attached to ($t)"; exit 1 }
    print $"✓ uploaded + verified ($got) asset\(s\) to ($repo)"
  }
}
'''
