# tasks/mise.toml — TOML-task definitions for the mise:* namespace.
#
# Tasks:
#   mise:upgrade — thin wrapper around `mise upgrade --bump --local` that's
#                  safer than the bare command (won't bump the global config).
#   mise:sweep   — reclaim dead mise state (dead config links + unused tool
#                  versions) across every repo under --root. Safe: re-tracks
#                  all live configs first so prune can't over-delete.
#
# Consumer wiring:
#   [task_config]
#   includes = [
#     "git::https://github.com/joeblew999/.github.git//tasks/mise.toml?ref=<tag>",
#   ]

# ── mise:upgrade ─────────────────────────────────────────────────────────────
# Bump pinned tool versions in this repo's mise.toml. The `--local` flag
# is critical: without it, mise upgrade leaks bumps into the user's
# global ~/.config/mise/config.toml.
["mise:upgrade"]
description = "Bump pinned tool versions in this repo's mise.toml via `mise upgrade --bump --local`. Idempotent."
run = '''
#!/usr/bin/env nu

def main [
  --dry-run          # show what would change without writing
] {
  if $dry_run {
    print "→ mise upgrade --bump --local --dry-run"
    ^mise upgrade --bump --local --dry-run
    return
  }

  let project_root = ($env.MISE_PROJECT_ROOT? | default (pwd))
  cd $project_root

  let before = (open --raw mise.toml)
  print "→ mise upgrade --bump --local"
  ^mise upgrade --bump --local

  let after = (open --raw mise.toml)
  if $before == $after {
    print "✓ nothing to upgrade — mise.toml unchanged"
    return
  }

  print ""
  print "✓ mise.toml bumped:"
  ^git --no-pager diff -- mise.toml
}
'''

# ── mise:sweep ───────────────────────────────────────────────────────────────
# Reclaim dead mise state across every repo under --root (default: $PWD):
#   1. Re-track every live mise config so `prune --tools` can't over-delete a
#      version a live-but-unvisited repo still pins.
#   2. `mise prune --configs` (dead repo links) + `mise prune --tools -y`.
# Removed tool versions auto-reinstall on demand for most backends.
# Use --dry-run to preview without deleting.
["mise:sweep"]
description = "Reclaim dead mise state (dead config links + unused tool versions) across all repos under --root. Re-tracks live configs first so prune stays safe. Idempotent."
run = '''
#!/usr/bin/env nu

def main [
  --root: string = ""   # workspace root to scan; defaults to $env.PWD
  --dry-run             # show what would be removed without deleting anything
] {
  let root = (if ($root | is-empty) { $env.PWD } else { $root })
  print $"→ scanning ($root) for mise configs"

  let cfgs = (
    glob $"($root)/**/{mise,.mise}.toml"
    | where {|p| (not ($p | str contains "/target/")) and (not ($p | str contains "/.git/")) }
  )
  print $"  found ($cfgs | length) live configs — re-tracking so prune stays safe"

  for c in $cfgs {
    do { ^mise trust $c } | complete | ignore
    do { cd ($c | path dirname); ^mise ls --current } | complete | ignore
  }
  cd $root

  if $dry_run {
    print "→ mise prune --configs --dry-run"
    ^mise prune --configs --dry-run
    print "→ mise prune --tools --dry-run"
    ^mise prune --tools --dry-run
    print "(dry run — nothing deleted)"
    return
  }

  print "→ mise prune --configs"
  ^mise prune --configs
  print "→ mise prune --tools -y"
  ^mise prune --tools -y
  print "✓ sweep complete"
}
'''

# ── mise:global ──────────────────────────────────────────────────────────────
# Install the canonical COMMON toolset into the GLOBAL mise config — the single
# source of truth that every shared task inherits (nushell, fnox, gh, …). Plain
# `mise use -g` (no nushell needed, so it works on a bare runner), idempotent.
# Run it once locally; CI runs the SAME task. Keep this list in sync with the
# lib's own [tools] (ci:check-global guards it).
["mise:global"]
description = "Install the canonical common toolset into the global mise config (mise use -g). Run locally; CI runs it too. Idempotent."
run = "mise use -g github:nushell/nushell@latest fnox@latest gh@latest jq@latest usage@latest git-cliff@latest"

# ── ci:check-global ──────────────────────────────────────────────────────────
# Guard the mise configuration. Two invariants:
#   1. The canonical common toolset is present in the global config.
#   2. NEITHER the global config NOR any repo config manages Rust — i.e. no
#      `rust = …` and no `RUSTUP_TOOLCHAIN = …`. mise selects a Rust toolchain
#      by exporting RUSTUP_TOOLCHAIN, which is the HIGHEST-precedence override
#      in rustup and silently defeats every repo's rust-toolchain.toml. Rust is
#      delegated to rustup + per-repo rust-toolchain.toml; mise must stay out.
# Run locally or in CI; exits non-zero (with a fix hint) on any violation.
["ci:check-global"]
description = "Guard mise config: canonical global toolset present, and no `rust`/RUSTUP_TOOLCHAIN in any mise config (rustup + rust-toolchain.toml own Rust). Fails on violation."
run = '''
#!/usr/bin/env nu

def main [
  --root: string = ""   # workspace root to scan for repo configs; defaults to $env.PWD
] {
  mut violations = []

  # ── 1. global config: canonical toolset present, no Rust management ──────────
  let global = ($nu.home-dir | path join ".config" "mise" "config.toml")
  if ($global | path exists) {
    let txt = (open --raw $global)
    if ($txt | lines | any {|l| $l =~ '^\s*rust\s*=' }) {
      $violations = ($violations | append $"($global): declares `rust` — remove it; rustup + rust-toolchain.toml own the Rust toolchain")
    }
    if ($txt | lines | any {|l| $l =~ '^\s*RUSTUP_TOOLCHAIN\s*=' }) {
      $violations = ($violations | append $"($global): sets RUSTUP_TOOLCHAIN — remove it; it overrides every repo's rust-toolchain.toml")
    }
    for t in ["fnox" "gh" "jq" "usage" "git-cliff" "nushell"] {
      if not ($txt | str contains $t) {
        $violations = ($violations | append $"($global): missing canonical tool `($t)` — run `mise run mise:global`")
      }
    }
  } else {
    $violations = ($violations | append $"($global): not found — run `mise run mise:global`")
  }

  # ── 2. no repo config may manage Rust either ────────────────────────────────
  let root = (if ($root | is-empty) { $env.PWD } else { $root })
  let cfgs = (
    glob $"($root)/**/{mise,.mise}.toml"
    | where {|p| (not ($p | str contains "/target/")) and (not ($p | str contains "/.git/")) }
  )
  for c in $cfgs {
    let txt = (open --raw $c)
    if ($txt | lines | any {|l| $l =~ '^\s*rust\s*=' }) {
      $violations = ($violations | append $"($c): declares `rust` — remove it; pin via rust-toolchain.toml instead")
    }
    if ($txt | lines | any {|l| $l =~ '^\s*RUSTUP_TOOLCHAIN\s*=' }) {
      $violations = ($violations | append $"($c): sets RUSTUP_TOOLCHAIN — remove it; pin via rust-toolchain.toml instead")
    }
  }

  if ($violations | is-empty) {
    print "✓ ci:check-global — canonical global toolset present, no Rust override in any mise config"
    return
  }
  print -e "✗ ci:check-global found violations:"
  for v in $violations { print -e $"  • ($v)" }
  exit 1
}
'''

# ── mise:release ─────────────────────────────────────────────────────────────
# Tag + push a new semver release of THIS lib (local-only; no CI/goreleaser).
#   mise run mise:release -- v0.28.0
["mise:release"]
description = "Tag + push a new semver release (vX.Y.Z). On main, clean tree only. Local; no CI."
run = '''
#!/usr/bin/env nu
def main [tag?: string] {
  let t = ($tag | default "")
  if ($t | is-empty) { print -e "✗ usage: mise run mise:release -- vX.Y.Z"; exit 1 }
  if not ($t =~ '^v[0-9]+\.[0-9]+\.[0-9]+$') { print -e "✗ tag must be vX.Y.Z"; exit 1 }
  if ((^git rev-parse --abbrev-ref HEAD | str trim) != "main") { print -e "✗ not on main"; exit 1 }
  if ((^git diff --quiet | complete | get exit_code) != 0) or ((^git diff --cached --quiet | complete | get exit_code) != 0) {
    print -e "✗ working tree dirty — commit first"; exit 1
  }
  if (^git tag -l $t | str trim | is-not-empty) { print -e $"✗ tag ($t) already exists"; exit 1 }
  ^git tag $t
  ^git push origin $t
  print $"✓ tagged ($t) and pushed — consumers: bump ?ref=($t)"
}
'''
