name: Reusable Mise CI

# ▸ How this works (bootstrap, matrix, isomorphic local==CI): the repo ROOT README.md (SSOT).
# Reusable workflow — every joeblew999 repo can call this from its own
# .github/workflows/<name>.yml via:
#
#   jobs:
#     ci:
#       uses: joeblew999/.github/.github/workflows/reusable-mise-ci.yml@vX.Y.Z
#       with:
#         task: ci                         # (default) name of the mise task to run
#         os-matrix: '["ubuntu-latest", "macos-latest", "windows-latest"]'
#         mise-version: 2026.5.1
#         rust-cache: true                 # set false if no Rust crate
#
# The task itself (e.g. `mise run ci`) is defined in the consuming repo,
# either inline in mise.toml or in mise-tasks/. SSOT: workflow runs ONE
# task; that task's depends graph fans out the work.

on:
  workflow_call:
    inputs:
      task:
        description: 'Name of the mise task to run'
        type: string
        default: 'ci'
      os-matrix:
        description: 'JSON array of GH runners (default linux/macos/windows)'
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      mise-version:
        description: 'mise binary version to install'
        type: string
        default: '2026.5.1'
      rust-cache:
        description: 'Enable the Rust build cache (Swatinem/rust-cache: ~/.cargo + target/). Set false for non-Rust repos.'
        type: boolean
        default: true
      timeout-minutes:
        description: 'Per-job timeout. Caps a hung task (a bad test can otherwise run to GitHub''s 6h default). Default 60 is generous enough for a legit cold windows compile; a timed-out run still saves its cache (cache-on-failure), so the retry is warmer. Lower it for fast repos.'
        type: number
        default: 60
      # ── DEPRECATED, tolerated for old stubs (append-only-surface: inputs are surface) ──
      # Workflow inputs are hardcoded in every bootstrapped stub, so removing one
      # startup_fails any consumer still on an old stub the moment they bump the @ref
      # (this bit jackdaw). Keep the retired inputs as tolerated no-ops so an @ref bump
      # NEVER breaks — regenerate the stub (`mise run mise:repo:bootstrap`) to drop them.
      sccache:
        description: 'DEPRECATED — old name for rust-cache. AND-merged below (either can disable). Regenerate the stub to drop.'
        type: boolean
        default: true
      cargo-lock-path:
        description: 'DEPRECATED no-op — rust-cache auto-detects Cargo.lock. Kept so old stubs do not startup_fail.'
        type: string
        default: ''

# Silence the DEP0040 punycode deprecation warning that mise-action / rust-cache
# emit from their bundled Node deps (not our code, harmless, upstream's to drop).
# Workflow-level so it reaches post-steps too (rust-cache warns on cache-save).
env:
  NODE_OPTIONS: --no-deprecation

jobs:
  run:
    name: ${{ inputs.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os-matrix) }}
    steps:
      - uses: actions/checkout@v7

      # Shared setup (mise + tool cache + rust build cache + global bootstrap).
      # Owned by ONE composite action so ci/release/upgrade can't drift on caching.
      - uses: joeblew999/.github/.github/actions/mise-setup@main
        with:
          cache-key: mise-${{ inputs.task }}-${{ matrix.os }}-${{ hashFiles('mise.toml') }}
          # AND-merge the deprecated `sccache` alias: cache runs only if BOTH are true,
          # so a stub setting EITHER `rust-cache: false` or `sccache: false` disables it.
          rust-cache: ${{ inputs.rust-cache && inputs.sccache }}
          rust-cache-key: ${{ inputs.task }}

      # MISE_JOBS=1: run the task's `depends` graph serially. A `ci` task fans
      # out several cargo invocations (build / clippy / test); on a COLD cache
      # (e.g. a fresh windows runner) those parallel cargo processes fight the
      # package-cache + build-directory locks and effectively deadlock for
      # hours. Serial = only cargo's own internal parallelism, no
      # cross-invocation lock contention. Warm runs hit rust-cache (no compile)
      # so serialising costs ~0. CI-only — local `mise run` stays parallel.
      - run: mise run ${{ inputs.task }}
        env:
          MISE_JOBS: 1

      # SURFACE (don't fail) tracked-file changes left by the task. A task that
      # rewrites a committed fixture races other tasks and hides drift (this bit us:
      # a task regenerated a file a test read via include_str!). WARNING ONLY — many
      # repos legitimately regenerate tracked files in CI (codegen), and this must
      # not break them. A repo that wants it strict can assert clean in its own task.
      - name: Check the working tree is clean after CI
        shell: bash
        run: |
          if ! git diff --quiet; then
            echo "::warning::a CI task modified tracked file(s) — prefer a temp path, or commit the regenerated output:"
            git --no-pager diff --stat
          fi
